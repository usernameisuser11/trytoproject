<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Traced Sky Timelapse v6</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06152e}#paint,#three{position:fixed;inset:0;width:100%;height:100%;display:block}#hint{position:fixed;right:14px;bottom:12px;color:rgba(255,255,255,.42);font:11px system-ui;letter-spacing:.08em;z-index:5;pointer-events:none}</style></head><body>
<canvas id="paint"></canvas><div id="hint">1~6 시간대 · R 자동재생</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="https://rawcdn.githack.com/usernameisuser11/trytoproject/084cffe568fb7902b06c2471f33c35f8efaa6541/sky-timelapse-v5/data.js"></script>
<script>
try{
const DATA_B64=window.TRACE_DATA_B64;
if(!DATA_B64) throw new Error('TRACE DATA LOAD FAILED');
if(!window.pako) throw new Error('PAKO LOAD FAILED');
const bin=Uint8Array.from(atob(DATA_B64),c=>c.charCodeAt(0));
const text=new TextDecoder().decode(pako.ungzip(bin));
const DATA=JSON.parse(text);
const canvas=document.getElementById('paint'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,dpr=1;
const phaseStops=[0,.16,.34,.57,.75,1];
let forced=2,start=performance.now(),texture=null,renderer=null,scene=null,camera=null;
function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))} function mix(a,b,t){return a+(b-a)*t} function mixC(a,b,t){return [mix(a[0],b[0],t),mix(a[1],b[1],t),mix(a[2],b[2],t)]}
function rgba(c,a=1){return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`}
function rng(seed){return function(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function gaussian(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const digits='0123456789abcdefghijklmnopqrstuvwxyz';
function decodeLabels(){let out=new Uint8Array(DATA.tw*DATA.th),rows=DATA.rle.split('|');for(let y=0;y<rows.length;y++){let x=0;for(const s of rows[y].split(',')){let lab=digits.indexOf(s[0]),len=parseInt(s.slice(1),36);out.fill(lab,y*DATA.tw+x,y*DATA.tw+x+len);x+=len}}return out} const LABELS=decodeLabels();
const terrainCanv=[];
function buildTerrainCanvases(){terrainCanv.length=0;for(const pal of DATA.phasePalettes){let c=document.createElement('canvas');c.width=DATA.tw;c.height=DATA.th;let g=c.getContext('2d'),im=g.createImageData(DATA.tw,DATA.th),p=im.data;for(let i=0;i<LABELS.length;i++){let q=pal[LABELS[i]],o=i*4;p[o]=q[0];p[o+1]=q[1];p[o+2]=q[2];p[o+3]=q[3]}g.putImageData(im,0,0);terrainCanv.push(c)}}
buildTerrainCanvases();
let cloudSeeds=[],starsLayer=null,galaxyLayer=null;
function buildCloudSeeds(){cloudSeeds=[];let r=rng(314159);for(let i=0;i<34;i++){let cx=r()*1.12-.06,cy=.08+r()*.39,base=.015+r()*.045,n=3+Math.floor(r()*4);let parts=[];for(let k=0;k<n;k++)parts.push([(r()-.5)*base*1.8,(r()-.5)*base*.48,base*(.55+r()*.85),base*(.16+r()*.22)]);cloudSeeds.push([cx,cy,parts,r(),r()])}}
function makeLayers(){starsLayer=document.createElement('canvas');starsLayer.width=W;starsLayer.height=H;let s=starsLayer.getContext('2d'),r=rng(71231);s.clearRect(0,0,W,H);for(let i=0;i<3400;i++){let x=r()*W,y=r()*H*.69,rr=r()<.018?1.2+r()*1.8:.22+r()*.65,a=.18+r()*.62;s.fillStyle=`rgba(235,243,255,${a})`;s.beginPath();s.arc(x,y,rr,0,Math.PI*2);s.fill()} galaxyLayer=document.createElement('canvas');galaxyLayer.width=W;galaxyLayer.height=H;let g=galaxyLayer.getContext('2d');g.clearRect(0,0,W,H);let rb=rng(99181);for(let i=0;i<850;i++){let x=clamp(.58+gaussian(rb)*.19,.22,1.06)*W,center=(.305+Math.sin((x/W)*7.3)*.012)*H,y=center+gaussian(rb)*H*.045,rad=(.006+rb()*.028)*W;let gr=g.createRadialGradient(x,y,0,x,y,rad),pink=rb()<.28;gr.addColorStop(0,pink?'rgba(255,156,218,.075)':'rgba(137,178,255,.09)');gr.addColorStop(.45,pink?'rgba(235,130,204,.035)':'rgba(120,158,245,.035)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.ellipse(x,y,rad,rad*.35,0,0,Math.PI*2);g.fill()}for(let i=0;i<15000;i++){let x=clamp(.60+gaussian(rb)*.20,.12,1.06)*W,center=(.305+Math.sin((x/W)*7.0)*.012)*H,spread=H*(.012+rb()*.055),y=center+gaussian(rb)*spread*(.28+rb()*.72);if(y<0||y>H*.63)continue;let q=rb(),sz=.25+rb()*1.05;g.fillStyle=q<.11?'rgba(255,181,226,.68)':q<.48?'rgba(171,202,255,.62)':'rgba(247,248,255,.68)';g.fillRect(x,y,sz,sz)}for(let i=0;i<95;i++){let x=clamp(.62+gaussian(rb)*.14,.34,.94)*W,center=(.305+Math.sin((x/W)*7.0)*.012)*H,y=center+gaussian(rb)*H*.025,rad=2+rb()*5;let gr=g.createRadialGradient(x,y,0,x,y,rad*4);gr.addColorStop(0,'rgba(245,247,255,.75)');gr.addColorStop(.18,'rgba(170,195,255,.35)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,rad*4,0,Math.PI*2);g.fill()}g.save();g.globalCompositeOperation='destination-out';g.lineCap='round';for(let j=0;j<3;j++){g.globalAlpha=.13+j*.025;g.lineWidth=H*(.007+j*.0018);g.beginPath();g.moveTo(W*.30,H*(.31+j*.008));g.bezierCurveTo(W*.46,H*(.26+j*.015),W*.65,H*(.34-j*.012),W*.95,H*(.295+j*.006));g.stroke()}g.restore()}
buildCloudSeeds();
function phaseAt(t){if(t<=0)return[0,1,0];for(let i=0;i<phaseStops.length-1;i++){if(t<=phaseStops[i+1]){let u=(t-phaseStops[i])/(phaseStops[i+1]-phaseStops[i]);u=u*u*(3-2*u);return[i,i+1,u]}}return[4,5,1]}
function drawSky(t,i,j,u){let A=DATA.skyPalettes[i],B=DATA.skyPalettes[j],top=mixC(A[0],B[0],u),mid=mixC(A[1],B[1],u),hor=mixC(A[2],B[2],u);let gr=ctx.createLinearGradient(0,0,0,H*.72);gr.addColorStop(0,rgba(top));gr.addColorStop(.55,rgba(mid));gr.addColorStop(1,rgba(hor));ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);let glow=ctx.createRadialGradient(W*.48,H*.67,0,W*.48,H*.67,W*.48),warm=Math.exp(-Math.pow((t-.55)/.18,2));glow.addColorStop(0,`rgba(255,210,150,${.15*warm})`);glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H*.82)}
function drawSun(t){if(t>.70)return;let u=clamp((t-.08)/.60),x=mix(W*.17,W*.79,u),y=H*(.70-Math.sin(u*Math.PI)*.34),a=clamp(1-Math.max(0,(t-.64)/.06));let gr=ctx.createRadialGradient(x,y,0,x,y,H*.08);gr.addColorStop(0,`rgba(255,241,197,${.36*a})`);gr.addColorStop(.25,`rgba(255,205,137,${.13*a})`);gr.addColorStop(1,'rgba(255,180,100,0)');ctx.fillStyle=gr;ctx.fillRect(x-H*.09,y-H*.09,H*.18,H*.18);ctx.fillStyle=`rgba(255,247,213,${.9*a})`;ctx.beginPath();ctx.arc(x,y,H*.0105,0,Math.PI*2);ctx.fill()}
function drawClouds(t,now){let sunset=Math.exp(-Math.pow((t-.57)/.16,2)),night=clamp((t-.72)/.22),alpha=.48*(1-night)+.13*night;for(let n=0;n<cloudSeeds.length;n++){let p=cloudSeeds[n],cx=((p[0]+now*(.0000018+.000001*p[3]))%1.16-.08)*W,cy=p[1]*H,base=[255,255,255],warm=[255,174,188],nc=[72,98,150],c=mixC(mixC(base,warm,sunset*.72),nc,night);ctx.save();ctx.globalAlpha=alpha*(.35+.65*p[4]);for(const q of p[2]){let x=cx+q[0]*W,y=cy+q[1]*H,rx=q[2]*W,ry=q[3]*H;ctx.save();ctx.translate(x,y);ctx.scale(1,ry/rx);let gr=ctx.createRadialGradient(0,0,0,0,0,rx);gr.addColorStop(0,rgba(c,.58));gr.addColorStop(.48,rgba(c,.23));gr.addColorStop(1,rgba(c,0));ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,rx,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.restore()}}
function drawNight(t){let a=clamp((t-.70)/.22);if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.drawImage(starsLayer,0,0);ctx.globalAlpha=clamp((t-.80)/.16)*.96;ctx.globalCompositeOperation='screen';ctx.drawImage(galaxyLayer,0,0);ctx.restore()}
function drawTerrain(i,j,u){let y=H*.69,h=H*.31;ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.globalAlpha=1-u;ctx.drawImage(terrainCanv[i],0,0,DATA.tw,DATA.th,0,y,W,h);ctx.globalAlpha=u;ctx.drawImage(terrainCanv[j],0,0,DATA.tw,DATA.th,0,y,W,h);ctx.restore();let night=clamp((Math.max(i,j)-3)/2),r=rng(8221);for(let k=0;k<15;k++){let x=(.14+r()*.75)*W,yy=(.82+r()*.09)*H,rx=(.045+r()*.085)*W,ry=(.006+r()*.013)*H;let gr=ctx.createRadialGradient(x,yy,0,x,yy,rx);gr.addColorStop(0,night>.5?'rgba(110,145,205,.12)':'rgba(226,239,248,.18)');gr.addColorStop(1,'rgba(0,0,0,0)');ctx.save();ctx.scale(1,ry/rx);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,yy*rx/ry,rx,0,Math.PI*2);ctx.fill();ctx.restore()}}
let shoot={active:false,x:0,y:0,vx:0,vy:0,a:0,next:0};function shooting(t,now){if(t<.84)return;if(!shoot.active&&now>shoot.next){shoot.active=true;shoot.x=(.1+Math.random()*.7)*W;shoot.y=(.08+Math.random()*.32)*H;shoot.vx=W*.0014;shoot.vy=H*.00065;shoot.a=1;shoot.next=now+9000+Math.random()*9000}if(shoot.active){ctx.save();ctx.globalCompositeOperation='screen';let len=W*.07,gr=ctx.createLinearGradient(shoot.x-len,shoot.y-len*.45,shoot.x,shoot.y);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,`rgba(255,255,255,${shoot.a})`);ctx.strokeStyle=gr;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(shoot.x-len,shoot.y-len*.45);ctx.lineTo(shoot.x,shoot.y);ctx.stroke();ctx.restore();shoot.x+=shoot.vx*16;shoot.y+=shoot.vy*16;shoot.a*=.94;if(shoot.a<.03)shoot.active=false}}
function frame(now){let t=forced>=0?phaseStops[forced]:(((now-start)/165000)%1),p=phaseAt(t),i=p[0],j=p[1],u=p[2];drawSky(t,i,j,u);drawSun(t);drawClouds(t,now);drawNight(t);drawTerrain(i,j,u);shooting(t,now);if(texture){texture.needsUpdate=true;renderer.render(scene,camera)}requestAnimationFrame(frame)}
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);makeLayers();if(renderer)renderer.setSize(W,H,false)}addEventListener('resize',resize);
function initThree(){try{if(!window.THREE)return;renderer=new THREE.WebGLRenderer({antialias:true});renderer.domElement.id='three';renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);document.body.insertBefore(renderer.domElement,document.getElementById('hint'));scene=new THREE.Scene();camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);texture=new THREE.CanvasTexture(canvas);texture.minFilter=THREE.LinearFilter;texture.magFilter=THREE.LinearFilter;let mesh=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial({map:texture}));scene.add(mesh);canvas.style.opacity='0'}catch(e){console.warn('Three fallback:',e)}}
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='6')forced=+e.key-1;else if(e.key.toLowerCase()==='r'){forced=-1;start=performance.now()}});
resize();initThree();requestAnimationFrame(frame);
}catch(e){console.error(e);const h=document.getElementById('hint');h.textContent='RENDER ERROR: '+e.message;h.style.color='white';h.style.background='rgba(0,0,0,.65)';h.style.padding='10px 12px';}
</script></body></html>
