<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Demon Particle Rebuild</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{background:radial-gradient(ellipse at 50% 52%,#180302 0%,#080101 38%,#000 80%)}svg{width:100vw;height:100vh;display:block}.hud{position:fixed;left:14px;top:14px;z-index:10;background:rgba(12,2,2,.72);border:1px solid rgba(255,99,71,.22);padding:10px 12px;color:#dcb0a6;line-height:1.35;backdrop-filter:blur(5px)}.hud b{display:block;color:#ff7f66;letter-spacing:.06em;margin-bottom:4px}.hud button{margin-top:8px;margin-right:6px;padding:5px 10px;background:#140403;color:#e2beb7;border:1px solid rgba(255,99,71,.28);cursor:pointer}.dot{transform-box:fill-box;transform-origin:center;opacity:0;animation:form var(--dur,3.8s) cubic-bezier(.2,.78,.12,1) var(--delay,0s) forwards}.ember{opacity:0;animation:ember var(--dur,4s) ease-in-out var(--delay,0s) infinite alternate}.boneDot{opacity:0;animation:formBone 2.2s ease-out var(--delay,0s) forwards,flicker 5s linear calc(var(--delay,0s) + 2.2s) infinite}.membrane{opacity:0;animation:form var(--dur,4.6s) cubic-bezier(.2,.78,.12,1) var(--delay,0s) forwards,shimmer 6s ease-in-out calc(var(--delay,0s) + 5s) infinite}.body{opacity:0;animation:form var(--dur,3.4s) cubic-bezier(.2,.78,.12,1) var(--delay,0s) forwards}.hot{opacity:0;animation:form 2.6s ease-out var(--delay,0s) forwards,pulse 3.5s ease-in-out calc(var(--delay,0s) + 2.4s) infinite}.vortex{opacity:0;animation:vortex 2.2s ease-out var(--delay,0s) forwards}.fadeout{animation:fadeout 3.2s ease-in-out 15s forwards}@keyframes form{0%{opacity:0;transform:translate(var(--dx,0px),var(--dy,0px)) scale(.25)}18%{opacity:.2}100%{opacity:1;transform:translate(0,0) scale(1)}}@keyframes formBone{0%{opacity:0;transform:translate(var(--dx,0px),var(--dy,0px)) scale(.2)}50%{opacity:1}100%{opacity:1;transform:translate(0,0) scale(1)}}@keyframes ember{0%{opacity:.15;transform:translate(0,0)}100%{opacity:.85;transform:translate(var(--ex,0px),var(--ey,-24px))}}@keyframes flicker{0%,100%{opacity:.75}50%{opacity:1}}@keyframes shimmer{0%,100%{opacity:.45}50%{opacity:.75}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes vortex{0%{opacity:0;transform:translate(var(--sx,0px),var(--sy,0px)) scale(1.4)}20%{opacity:.9}100%{opacity:0;transform:translate(0,0) scale(.2)}}@keyframes fadeout{to{opacity:.12}}</style>
</head>
<body>
<div class="hud"><b>DEMON — PARTICLE REBUILD</b><div>round dot particles only</div><div>no grid pattern</div><button id="restartBtn">Restart</button><button id="finalBtn">Final Form</button></div>
<svg id="scene" viewBox="0 0 1672 941" aria-label="particle demon scene"><defs><filter id="glowSmall" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="bgEmbers"></g><g id="vortex"></g><g id="membraneDots" filter="url(#glowSmall)"></g><g id="bodyDots" filter="url(#glowSmall)"></g><g id="boneDots" filter="url(#glowBig)"></g><g id="hotDots" filter="url(#glowBig)"></g></svg>
<script>
(()=>{const NS='http://www.w3.org/2000/svg',bg=document.getElementById('bgEmbers'),vortex=document.getElementById('vortex'),membranes=document.getElementById('membraneDots'),body=document.getElementById('bodyDots'),bones=document.getElementById('boneDots'),hot=document.getElementById('hotDots'),view={w:1672,h:941,cx:836,cy:488};function rand(a,b){return a+Math.random()*(b-a)}function mirrorX(x){return view.w-x}function circle(parent,x,y,r,fill,cls,styles=''){const el=document.createElementNS(NS,'circle');el.setAttribute('cx',x.toFixed(1));el.setAttribute('cy',y.toFixed(1));el.setAttribute('r',r.toFixed(2));el.setAttribute('fill',fill);el.setAttribute('class',cls);if(styles)el.setAttribute('style',styles);parent.appendChild(el);return el}function pointInPoly(x,y,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1],intersect=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi+1e-9)+xi);if(intersect)inside=!inside}return inside}function samplePoly(poly,count,jitter=1){let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;poly.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)});const pts=[];let tries=0,maxTries=count*35;while(pts.length<count&&tries<maxTries){tries++;const x=rand(minX,maxX),y=rand(minY,maxY);if(pointInPoly(x,y,poly))pts.push([x+rand(-jitter,jitter),y+rand(-jitter,jitter)])}return pts}function quad(a,b,c,t){const u=1-t;return[u*u*a[0]+2*u*t*b[0]+t*t*c[0],u*u*a[1]+2*u*t*b[1]+t*t*c[1]]}function curvePoints(a,b,c,n){const arr=[];for(let i=0;i<n;i++)arr.push(quad(a,b,c,i/(n-1)));return arr}function addDotCloud(parent,pts,opts={}){const{fill='#ff4d2e',cls='dot',dxFrom='center',dyBias=0,delayBase=0,delaySpread=2,size=[1.1,2.2]}=opts;pts.forEach((p,idx)=>{const[x,y]=p,dx=dxFrom==='center'?(view.cx-x)*rand(.35,.95):rand(-80,80),dy=(view.cy+dyBias-y)*rand(.35,.95),delay=delayBase+rand(0,delaySpread),r=rand(size[0],size[1]),fillColor=typeof fill==='function'?fill(x,y,idx):fill;circle(parent,x,y,r,fillColor,cls,`--dx:${dx.toFixed(1)}px;--dy:${dy.toFixed(1)}px;--delay:${delay.toFixed(2)}s;`)})}function build(){bg.innerHTML='';vortex.innerHTML='';membranes.innerHTML='';body.innerHTML='';bones.innerHTML='';hot.innerHTML='';for(let i=0;i<240;i++){const x=rand(20,1652),y=rand(18,923),r=rand(.8,2.2);circle(bg,x,y,r,Math.random()>.18?'#b12d1d':'#ff6d46','ember fadeout',`--delay:${rand(0,2).toFixed(2)}s;--dur:${rand(3.5,7).toFixed(2)}s;--ex:${rand(-8,8).toFixed(1)}px;--ey:${rand(-18,16).toFixed(1)}px;opacity:${rand(.18,.75)};`)}for(let i=0;i<440;i++){const ang=rand(-2.75,-.35),rr=rand(120,520),sx=Math.cos(ang)*rr,sy=Math.sin(ang)*rr*.62,x=view.cx+sx,y=view.cy+sy,tx=view.cx+Math.cos(ang+rand(.35,.85))*rand(40,120),ty=view.cy+Math.sin(ang+rand(.35,.85))*rand(40,120);circle(vortex,x,y,rand(1.1,2.1),Math.random()>.22?'#c43a22':'#ff7b55','vortex',`--delay:${rand(0,.9).toFixed(2)}s;--sx:${(x-tx).toFixed(1)}px;--sy:${(y-ty).toFixed(1)}px;`)}const leftTorso=[[821,254],[765,266],[710,303],[678,361],[656,420],[644,520],[643,621],[665,700],[709,764],[759,802],[807,828],[836,837],[836,254]],rightTorso=leftTorso.map(([x,y])=>[mirrorX(x),y]),centerMass=[[795,252],[877,252],[915,294],[938,347],[951,418],[955,523],[944,631],[914,727],[871,796],[836,837],[801,796],[758,727],[728,631],[717,523],[721,418],[734,347],[757,294]],leftArm=[[651,389],[611,431],[575,506],[554,576],[539,654],[521,711],[495,749],[463,752],[459,715],[480,661],[500,588],[525,486],[558,410],[605,360],[646,342]],rightArm=leftArm.map(([x,y])=>[mirrorX(x),y]),headL=[[810,207],[782,229],[770,262],[777,293],[803,316],[823,313],[836,287],[836,209]],headR=headL.map(([x,y])=>[mirrorX(x),y]),leftWing=[[832,330],[758,284],[667,246],[569,216],[472,194],[376,183],[291,191],[217,211],[150,255],[101,315],[73,387],[61,467],[59,560],[71,653],[100,738],[149,802],[216,849],[303,876],[395,877],[471,857],[532,815],[571,752],[590,678],[603,594],[617,510],[643,439],[693,384],[756,349]],rightWing=leftWing.map(([x,y])=>[mirrorX(x),y]);const wingLeftPts=samplePoly(leftWing,1550,1.8),wingRightPts=wingLeftPts.map(([x,y])=>[mirrorX(x)+rand(-1.5,1.5),y+rand(-1.5,1.5)]);function filterWing(pts,isLeft=true){return pts.filter(([x,y])=>{const dx=isLeft?(x-60)/(832-60):(mirrorX(x)-60)/(832-60),lowerDrop=y>760&&Math.random()<.45,innerGap=Math.abs(x-view.cx)<70&&y<390&&Math.random()<.85,edgeTatter=dx<.18&&Math.random()<.35,topSparse=y<220&&Math.random()<.25;return!lowerDrop&&!innerGap&&!edgeTatter&&!topSparse})}const wL=filterWing(wingLeftPts,true),wR=filterWing(wingRightPts,false),bodyPts=[].concat(samplePoly(centerMass,900,1.3)).concat(samplePoly(leftArm,160,1.2)).concat(samplePoly(rightArm,160,1.2)).concat(samplePoly(leftTorso,220,1.2)).concat(samplePoly(rightTorso,220,1.2)).concat(samplePoly(headL,70,.8)).concat(samplePoly(headR,70,.8));const leftShoulder=[758,347],boneCurvesL=[curvePoints(leftShoulder,[625,185],[404,82],48),curvePoints(leftShoulder,[561,261],[151,226],52),curvePoints(leftShoulder,[582,333],[177,548],48),curvePoints(leftShoulder,[605,456],[342,826],50),curvePoints([708,372],[597,251],[402,196],32),curvePoints([688,427],[547,364],[335,263],34),curvePoints([672,490],[539,474],[273,332],34),curvePoints([659,564],[539,603],[181,687],34)],bonePtsL=boneCurvesL.flat(),bonePtsR=bonePtsL.map(([x,y])=>[mirrorX(x),y]),hornLeft=curvePoints([816,182],[784,132],[773,98],30),hornRight=hornLeft.map(([x,y])=>[mirrorX(x),y]),chest=curvePoints([836,386],[836,470],[836,585],26).concat(curvePoints([806,430],[836,404],[866,430],16)).concat(curvePoints([812,487],[836,458],[860,487],14)),eyeL=[[809,252],[803,253],[798,255],[802,249],[807,248]],eyeR=eyeL.map(([x,y])=>[mirrorX(x),y]),hotWingL=[...curvePoints([379,290],[470,352],[525,495],42),...curvePoints([419,246],[517,285],[617,360],38),...curvePoints([452,340],[548,438],[602,622],44),...curvePoints([492,521],[521,645],[510,773],38)],hotWingR=hotWingL.map(([x,y])=>[mirrorX(x),y]),lowerEmber=curvePoints([836,763],[838,822],[836,868],22).concat(curvePoints([822,863],[836,876],[850,863],10));const memFill=(x,y)=>{const nearBone=Math.abs(x-view.cx)>200&&y<760;if(Math.random()<.06)return'#ff9b77';if(Math.random()<.22)return'#ff5a32';return nearBone?'#bc311d':'#8d1d12'};addDotCloud(membranes,wL,{fill:memFill,cls:'dot membrane fadeout',delayBase:6.2,delaySpread:2.2,size:[1,1.9]});addDotCloud(membranes,wR,{fill:memFill,cls:'dot membrane fadeout',delayBase:6.4,delaySpread:2.2,size:[1,1.9]});const bodyFill=(x,y)=>{if(y<320||(Math.abs(x-view.cx)<95&&y<405&&Math.random()<.45))return'#f2d9d0';if(Math.random()<.18)return'#6f1009';return'#1d100f'};addDotCloud(body,bodyPts,{fill:bodyFill,cls:'dot body fadeout',delayBase:2.4,delaySpread:3.2,size:[1.15,2.2],dyBias:170});addDotCloud(bones,bonePtsL,{fill:()=>Math.random()<.2?'#ffd4c8':'#ff6843',cls:'dot boneDot fadeout',delayBase:5.3,delaySpread:1.1,size:[1.4,2.7]});addDotCloud(bones,bonePtsR,{fill:()=>Math.random()<.2?'#ffd4c8':'#ff6843',cls:'dot boneDot fadeout',delayBase:5.35,delaySpread:1.1,size:[1.4,2.7]});addDotCloud(hot,hornLeft.concat(hornRight).concat(chest).concat(eyeL).concat(eyeR).concat(hotWingL).concat(hotWingR).concat(lowerEmber),{fill:(x,y)=>(y<280||Math.abs(x-view.cx)<50)?'#ff3219':(Math.random()<.18?'#ffd6bf':'#ff5930'),cls:'dot hot fadeout',delayBase:4.2,delaySpread:3.1,size:[1.6,2.8],dyBias:70})}function restart(){build()}function finalForm(){document.querySelectorAll('.dot,.boneDot,.vortex,.ember').forEach(el=>{el.style.animation='none';el.style.opacity=el.classList.contains('vortex')?0:1;el.style.transform='translate(0,0) scale(1)'})}document.getElementById('restartBtn').addEventListener('click',restart);document.getElementById('finalBtn').addEventListener('click',finalForm);build()})();
</script>
</body>
</html>
