<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Demon Full Silhouette Trace v12</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#d8aaa1;font:11px system-ui,-apple-system,"Segoe UI",sans-serif}
#app{position:fixed;inset:0}canvas{display:block;width:100vw!important;height:100vh!important}
#load{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#000;color:#a74232;letter-spacing:.12em;text-align:center}
#hud{position:fixed;left:12px;top:12px;z-index:20;padding:8px 10px;border:1px solid #ff64452b;border-radius:7px;background:#090101b8;opacity:.20;transition:.2s;line-height:1.45;backdrop-filter:blur(5px)}
#hud:hover{opacity:1}#hud b{display:block;color:#ff745b;letter-spacing:.07em}#phase{color:#db9385}button{margin-top:6px;margin-right:5px;padding:5px 9px;border:1px solid #ff604038;background:#160302;color:#dbb9b1;font:inherit;cursor:pointer}

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.161.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.161.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div>
<div id="load">LOADING FULL SILHOUETTE TRACE…</div>
<div id="hud"><b>DEMON — FULL TRACE v12</b><div id="phase">VOID</div><div id="stats">reference silhouette → round GPU particles</div><button id="restart">Restart</button><button id="final">Final Form</button></div>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
const MW=836,MH=471,TARGET_COUNT=39500,TOTAL=43;
const load=document.getElementById('load'),phaseEl=document.getElementById('phase'),stats=document.getElementById('stats');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const hash=n=>{const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
try{
const paths=Array.from({length:6},(_,i)=>`demon_trace/v12h/part${i}.txt`);
const parts=await Promise.all(paths.map(async p=>{const r=await fetch(p+'?v=12',{cache:'no-store'});if(!r.ok)throw Error('TRACE '+p+' '+r.status);return (await r.text()).trim()}));
const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=()=>no(Error('TRACE MAP DECODE ERROR'));im.src='data:image/webp;base64,'+parts.join('')});
const cv=document.createElement('canvas');cv.width=MW;cv.height=MH;const cx=cv.getContext('2d',{willReadFrequently:true});if(!cx)throw Error('TRACE CANVAS ERROR');
cx.drawImage(im,0,0,MW,MH);const d=cx.getImageData(0,0,MW,MH).data,raw=[];
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const o=(y*MW+x)*4,a=d[o+3];if(a<8)continue;const reg=clamp(Math.round((a-24)/32),1,5);raw.push({x:x*2+1,y:y*2+1,r:d[o],g:d[o+1],b:d[o+2],reg});}
if(raw.length<30000)throw Error('TRACE POINT COUNT '+raw.length);
const pts=raw.slice(),priority=raw.filter(p=>p.reg!==4||(p.r+p.g+p.b)>20).sort((a,b)=>((b.reg===5)-(a.reg===5))*1000+(b.r+b.g+b.b)-(a.r+a.g+a.b));let dk=0;
while(pts.length<TARGET_COUNT){const p=priority[dk++%priority.length];pts.push({...p,x:p.x+(hash(dk*3.17)-.5)*1.6,y:p.y+(hash(dk*7.71)-.5)*1.6});}if(pts.length>TARGET_COUNT)pts.length=TARGET_COUNT;
load.textContent='BUILDING 39,500 ROUND GPU PARTICLES…';
const scene=new THREE.Scene();scene.background=new THREE.Color(0);scene.fog=new THREE.FogExp2(0x050000,.00065);
const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,700);cam.position.set(0,0,90);cam.lookAt(0,-1,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.3));renderer.setSize(innerWidth,innerHeight);document.getElementById('app').appendChild(renderer.domElement);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,cam));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.40,.28,.14);bloom.threshold=.14;bloom.strength=.40;bloom.radius=.28;composer.addPass(bloom);
let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;for(const p of pts){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)}
const centerX=(minX+maxX)*.5,centerY=(minY+maxY)*.5,S=.103,N=pts.length,pos=new Float32Array(N*3),start=new Float32Array(N*3),target=new Float32Array(N*3),col=new Float32Array(N*3),size=new Float32Array(N),seed=new Float32Array(N),region=new Float32Array(N);let wx0=1e9,wx1=-1e9,wy0=1e9,wy1=-1e9;const counts=[0,0,0,0,0,0];
for(let i=0;i<N;i++){const q=pts[i],j=i*3,R=q.reg,s=hash(i*1.731+q.x*.013+q.y*.021),tx=(q.x-centerX)*S,ty=(centerY-q.y)*S-1.1,tz=(hash(i*2.71)-.5)*.85;target[j]=tx;target[j+1]=ty;target[j+2]=tz;wx0=Math.min(wx0,tx);wx1=Math.max(wx1,tx);wy0=Math.min(wy0,ty);wy1=Math.max(wy1,ty);counts[R]++;const a=s*Math.PI*2,h1=hash(i*1.77),h2=hash(i*3.93),h3=hash(i*7.19);let sx,sy,sz;if(R===1){sx=(h1-.5)*34;sy=-58-h2*30;sz=(h3-.5)*24}else if(R===2){const rr=18+Math.pow(h1,.55)*48;sx=Math.cos(a)*rr;sy=(h2-.5)*66;sz=Math.sin(a)*rr*.58+(h3-.5)*12}else if(R===3){const rr=14+Math.pow(h1,.6)*42;sx=Math.cos(a)*rr;sy=48+h2*35;sz=Math.sin(a)*rr*.5}else if(R===4){const side=tx<0?-1:1;sx=side*(44+h1*55);sy=8+(h2-.5)*78;sz=(h3-.5)*22}else{const rr=10+h1*38;sx=Math.cos(a)*rr;sy=(h2-.5)*50;sz=Math.sin(a)*rr*.6}start[j]=pos[j]=sx;start[j+1]=pos[j+1]=sy;start[j+2]=pos[j+2]=sz;const L=(q.r*.2126+q.g*.7152+q.b*.0722)/255;let cr=q.r/255,cg=q.g/255,cb=q.b/255;if(R===1){cr=Math.max(cr*.55,.25);cg=Math.max(cg*.45,.036);cb=Math.max(cb*.42,.022)}else if(R===2){cr=Math.max(cr*.58,.27);cg=Math.max(cg*.48,.040);cb=Math.max(cb*.44,.025)}else if(R===3){cr=Math.max(cr*.68,.34);cg=Math.max(cg*.55,.055);cb=Math.max(cb*.48,.032)}else if(R===4){cr=Math.max(cr*.58,.18);cg=Math.max(cg*.48,.025);cb=Math.max(cb*.45,.017)}else{cr=Math.min(1,Math.max(cr*1.10+.10,.62));cg=Math.min(1,Math.max(cg*.92+.035,.09));cb=Math.min(1,Math.max(cb*.78+.02,.045))}col[j]=clamp(cr);col[j+1]=clamp(cg);col[j+2]=clamp(cb);let z=.78+Math.pow(L,.72)*1.10;if(R===5)z+=.38;else if(R===3)z+=.16;else if(R===4)z-=.04;size[i]=Math.max(.68,z);seed[i]=s;region[i]=R;}
const bboxW=wx1-wx0,bboxH=wy1-wy0;function fitCamera(){const aspect=innerWidth/innerHeight,fov=THREE.MathUtils.degToRad(cam.fov),zH=(bboxH*.5)/(Math.tan(fov*.5)*.91),zW=(bboxW*.5)/(Math.tan(fov*.5)*aspect*.97);cam.position.z=Math.max(zH,zW,73);cam.aspect=aspect;cam.updateProjectionMatrix();cam.lookAt(0,-1,0)}fitCamera();
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('aStart',new THREE.BufferAttribute(start,3));geo.setAttribute('aTarget',new THREE.BufferAttribute(target,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.setAttribute('aSize',new THREE.BufferAttribute(size,1));geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));geo.setAttribute('aRegion',new THREE.BufferAttribute(region,1));
const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexColors:true,blending:THREE.NormalBlending,uniforms:{uTime:{value:0},uProgress:{value:0},uPointScale:{value:3.75},uOpacity:{value:.98},uFade:{value:1}},vertexShader:`attribute vec3 aStart,aTarget;attribute float aSize,aSeed,aRegion;varying vec3 vColor;varying float vAlpha;uniform float uTime,uProgress,uPointScale,uFade;float sat(float x){return clamp(x,0.,1.);}float ease(float x){x=sat(x);return 1.-pow(1.-x,4.);}float stage(float a,float b){return ease((uProgress-a)/max(.0001,b-a));}void main(){float a=.0,b=1.;if(aRegion<1.5){a=.16;b=.38;}else if(aRegion<2.5){a=.29;b=.55;}else if(aRegion<3.5){a=.43;b=.64;}else if(aRegion<4.5){a=.57;b=.88;}else{a=.80;b=.97;}float t=stage(a,b);vec3 dir=aTarget-aStart;vec3 perp=normalize(vec3(-dir.y,dir.x,.001));float arc=sin(t*3.14159265)*(1.-t);float sw=sin(aSeed*35.+uTime*.42+t*8.)*arc*(1.2+4.0*aSeed);vec3 p=mix(aStart,aTarget,t)+perp*sw;float unsettled=1.-smoothstep(.90,1.,uProgress);p+=vec3(sin(uTime*.72+aSeed*27.)*.07,cos(uTime*.61+aSeed*19.)*.07,0.)*unsettled*t;float settle=smoothstep(.94,1.,uProgress);p=mix(p,aTarget,settle);vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;gl_PointSize=max(2.6,aSize*uPointScale*(114./max(1.,-mv.z)));vColor=color;vAlpha=t*uFade;}`,fragmentShader:`varying vec3 vColor;varying float vAlpha;uniform float uOpacity;void main(){vec2 q=gl_PointCoord-.5;float d=length(q);if(d>.5)discard;float core=1.-smoothstep(.02,.24,d);float halo=1.-smoothstep(.20,.50,d);vec3 c=vColor*(.78+core*.36);float a=(core*.88+halo*.22)*vAlpha*uOpacity;gl_FragColor=vec4(c,a);}`});scene.add(new THREE.Points(geo,mat));load.remove();stats.textContent=`${N.toLocaleString()} round particles · body ${counts[1]+counts[2]+counts[3]} · wings ${counts[4]} · hot ${counts[5]}`;let sim=0,last=performance.now(),freeze=false;const phase=p=>p<.10?'VOID':p<.20?'INFERNAL ANOMALY':p<.34?'LOWER BODY':p<.48?'TORSO / ARMS':p<.60?'HEAD / HORNS':p<.75?'WING STRUCTURE':p<.90?'WING MEMBRANE':p<.98?'EYES / EMBER CORE':'FINAL FORM';function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(!freeze){sim+=dt;if(sim>=TOTAL)sim=0}const p=freeze?1:clamp(sim/33,0,1);mat.uniforms.uTime.value=sim;mat.uniforms.uProgress.value=p;let fade=1;if(!freeze&&sim>37)fade=1-(sim-37)/6*.70;mat.uniforms.uFade.value=clamp(fade,.30,1);phaseEl.textContent=freeze?'FINAL FORM — EXACT TARGET':phase(p);composer.render()}requestAnimationFrame(loop);document.getElementById('restart').onclick=()=>{sim=0;freeze=false;mat.uniforms.uFade.value=1};document.getElementById('final').onclick=()=>{freeze=true;mat.uniforms.uProgress.value=1;mat.uniforms.uFade.value=1};addEventListener('resize',()=>{fitCamera();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
}catch(e){console.error(e);load.textContent='ERROR — '+e.message}
</script>
