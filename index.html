<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference-Traced Demon</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#c6aaa5;font:12px system-ui}canvas{width:100%;height:100%;display:block}#load{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:9;color:#8b4337;letter-spacing:.12em;text-align:center;padding:24px}#hud{position:fixed;left:14px;top:14px;z-index:5;background:#080101aa;border:1px solid #6f211b55;padding:10px 12px}button{background:#160403;color:#c6aaa5;border:1px solid #7a2a2355;padding:5px 8px;margin-right:5px}</style></head><body><canvas id="c"></canvas><div id="load">LOADING TRACED COORDINATES…</div><div id="hud"><b>REFERENCE-TRACED DEMON — RAW WEBGL</b><div id="phase">VOID</div><div><button id="final">Final Form</button><button id="restart">Restart</button></div></div><script>
(async()=>{const load=document.getElementById('load'),canvas=document.getElementById('c');try{const files=['demon_payload/p0.txt','demon_payload/p1.txt','demon_payload/p2.txt','demon_payload/p3.txt'];const parts=await Promise.all(files.map(async p=>{const r=await fetch(p+'?rawgl=1',{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.text()}));const old=parts.join(''),mm=old.match(/const COUNTMAP='(data:image\/(?:webp|png);base64,[^']+)'/);if(!mm)throw Error('COUNTMAP NOT FOUND');const COUNTMAP=mm[1],W=512,H=258,N0=53080;load.textContent='DECODING 53,080 TRACED POINTS…';const img=new Image();img.onerror=()=>{load.textContent='COUNTMAP IMAGE ERROR'};img.onload=()=>{try{load.textContent='BUILDING 53,080 GPU POINTS…';const q=document.createElement('canvas');q.width=W;q.height=H;const ctx=q.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);const d=ctx.getImageData(0,0,W,H).data;let N=0;for(let i=0;i<d.length;i+=4)N+=d[i];if(N!==N0)throw Error('POINT COUNT '+N);const tar=new Float32Array(N*2),sc=new Float32Array(N*2),seed=new Float32Array(N),delay=new Float32Array(N),edge=new Float32Array(N),reg=new Float32Array(N);const L=[[224,112],[218,92],[214,70],[207,52],[198,38],[188,25],[175,16],[157,9],[136,5],[112,5],[90,8],[66,11],[43,15],[22,21],[5,27],[0,31],[0,126],[12,120],[25,132],[39,145],[53,153],[66,166],[78,151],[91,163],[104,173],[115,155],[127,170],[139,160],[151,171],[163,154],[175,161],[187,148],[198,145],[207,134],[216,124]],R=L.map(p=>[511-p[0],p[1]]);function inside(px,py,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){let a=p[i],b=p[j];if(((a[1]>py)!=(b[1]>py))&&(px<(b[0]-a[0])*(py-a[1])/(b[1]-a[1]+1e-9)+a[0]))c=!c}return c}function cnt(px,py){return px<0||py<0||px>=W||py>=H?0:d[(py*W+px)*4]}function h(n){let x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x)}let o=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let n=cnt(x,y);if(!n)continue;let ed=!cnt(x-1,y)||!cnt(x+1,y)||!cnt(x,y-1)||!cnt(x,y+1),rg=inside(x,y,L)||inside(x,y,R)?1:(y<82&&x>218&&x<294?2:(y>84&&y<101&&x>244&&x<268?3:0));for(let z=0;z<n;z++,o++){let s=h(o*1.731+z*17.17),a=h(o*.731+9.2)*6.28318,r=180+h(o*1.113+17.4)*420;tar[o*2]=x-255.5;tar[o*2+1]=128.5-y;sc[o*2]=Math.cos(a)*r;sc[o*2+1]=(h(o*2.19+3.7)-.5)*500;seed[o]=s;edge[o]=ed?1:0;reg[o]=rg;delay[o]=rg===1?.54+Math.abs(x/511-.5)*.125+s*.03:rg===2?.43+s*.10:rg===3?.82+s*.025:.10+(1-y/257)*.34+s*.025}}
const gl=canvas.getContext('webgl',{antialias:false});if(!gl)throw Error('WEBGL UNAVAILABLE');const vs=`attribute vec2 t,s;attribute float r,e,z,d;uniform float p,time,fin,hx,hy;varying float vr,ve,vz,va;float sat(float x){return clamp(x,0.,1.);}void main(){float f=sat((p-d)/max(.055,1.-d));f=f*f*(3.-2.*f);if(fin>.5)f=1.;vec2 v=mix(s,t,f);float m=(1.-f)*(1.-fin),a=z*6.283+time*(.16+.13*z);v+=vec2(cos(a),sin(a*1.07))*m*(6.+14.*z);gl_Position=vec4(v.x/hx,v.y/hy,0.,1.);gl_PointSize=1.5+e*1.8+z*.8;vr=r;ve=e;vz=z;va=.12+.88*f;}`;const fs=`precision mediump float;varying float vr,ve,vz,va;void main(){vec2 q=gl_PointCoord-.5;float dd=length(q);if(dd>.5)discard;float g=smoothstep(.5,0.,dd);vec3 c=vec3(.08,.002,.001);if(vr>.5)c=vec3(.18,.004,.002);if(vr>1.5)c=vec3(.62,.025,.006);if(vr>2.5)c=vec3(1.,.10,.018);c=mix(c,vec3(1.,.05,.01),ve*(.25+.4*vz));gl_FragColor=vec4(c*(.75+g*1.5),g*va*(.45+.55*ve));}`;function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));gl.useProgram(pr);function attr(name,data,n){let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);let l=gl.getAttribLocation(pr,name);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,n,gl.FLOAT,false,0,0)}attr('t',tar,2);attr('s',sc,2);attr('r',reg,1);attr('e',edge,1);attr('z',seed,1);attr('d',delay,1);const up=gl.getUniformLocation(pr,'p'),ut=gl.getUniformLocation(pr,'time'),uf=gl.getUniformLocation(pr,'fin'),uhx=gl.getUniformLocation(pr,'hx'),uhy=gl.getUniformLocation(pr,'hy');gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);function resize(){const D=Math.min(devicePixelRatio||1,1.5),cw=Math.floor(innerWidth*D),ch=Math.floor(innerHeight*D);canvas.width=cw;canvas.height=ch;gl.viewport(0,0,cw,ch);const a=cw/ch,m=1.07;let hx=W*m/2,hy=H*m/2;if(hx/hy<a)hx=hy*a;else hy=hx/a;gl.uniform1f(uhx,hx);gl.uniform1f(uhy,hy)}addEventListener('resize',resize);resize();load.remove();let start=performance.now(),final=false;document.getElementById('final').onclick=()=>final=!final;document.getElementById('restart').onclick=()=>{start=performance.now();final=false};function loop(now){const t=(now-start)/1000,p=(t%40)/40;gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(up,final?1:p);gl.uniform1f(ut,t);gl.uniform1f(uf,final?1:0);gl.drawArrays(gl.POINTS,0,N);document.getElementById('phase').textContent=final?'FINAL FORM — exact traced target':'FORMATION '+Math.floor(p*100)+'%';requestAnimationFrame(loop)}requestAnimationFrame(loop)}catch(e){console.error(e);load.textContent='ERROR — '+e.message}};img.src=COUNTMAP}catch(e){console.error(e);load.textContent='LOAD ERROR — '+e.message}})();
