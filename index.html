html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#d9b8b0;font:12px system-ui,-apple-system,"Segoe UI",sans-serif}body{background:radial-gradient(ellipse at 50% 56%,#170302 0%,#050000 46%,#000 82%)}#scene{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}svg{width:100%;height:100%;display:block}.stage{opacity:0;transform-box:fill-box;transform-origin:center;will-change:transform,opacity}.bone{fill:none;stroke:#e94b32;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1 10;opacity:.9;filter:url(#softGlow)}#hotTrace{opacity:0;mix-blend-mode:screen}#embers,#vortex{position:fixed;inset:0;pointer-events:none;overflow:hidden}.ember,.vpart{position:absolute;border-radius:50%;background:#a3291b;box-shadow:0 0 5px #ff4b2b55}.ember{animation:floatEmber var(--d) ease-in-out var(--delay) infinite alternate}.vpart{opacity:0}.vortexOn .vpart{animation:vortexIn var(--vd) cubic-bezier(.3,.7,.2,1) var(--vdelay) both}@keyframes floatEmber{from{transform:translate3d(0,0,0);opacity:.15}to{transform:translate3d(var(--mx),var(--my),0);opacity:.75}}@keyframes vortexIn{0%{opacity:0;transform:translate3d(0,0,0) scale(.8)}25%{opacity:.8}100%{opacity:0;transform:translate3d(var(--vx),var(--vy),0) scale(.18)}}#hud{position:fixed;left:14px;top:14px;z-index:20;background:#080101ca;border:1px solid #ff57352f;padding:10px 12px;line-height:1.45;backdrop-filter:blur(5px);min-width:235px}#hud b{color:#ff745b;letter-spacing:.08em}#phase{color:#e4a093;margin-top:2px}#meta{opacity:.68}button{margin-top:7px;margin-right:5px;padding:5px 8px;border:1px solid #ff56353a;background:#180302;color:#d9b8b0;font:inherit;cursor:pointer}#load{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#000;color:#b94e3c;letter-spacing:.12em;text-align:center}body.final .stage{opacity:1!important;transform:none!important}body.final #hotTrace{opacity:.42!important}body.final #vortex{display:none}

(async()=>{'use strict';const load=document.getElementById('load'),phase=document.getElementById('phase'),embers=document.getElementById('embers'),vortex=document.getElementById('vortex');try{const files=['demon_v6/part0.txt','demon_v6/part1.txt','demon_v6/part2.txt','demon_v6/part3_fixed.txt'];const parts=await Promise.all(files.map(async p=>{const r=await fetch(p+'?v=9',{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.text()}));const m=parts.join('').match(/const MAP='(data:image\/webp;base64,[^']+)'/);if(!m)throw Error('TRACE MAP NOT FOUND');const src=m[1],test=new Image();await new Promise((res,rej)=>{test.onload=res;test.onerror=()=>rej(Error('TRACE IMAGE ERROR'));test.src=src});document.getElementById('maskImg').setAttribute('href',src);document.getElementById('hotTrace').setAttribute('href',src);load.remove();

const ids=['legs','torso','arms','head','horns','wingBones','wingL','wingR','debris'],els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)])),timers=[],anims=[];function stop(){timers.splice(0).forEach(clearTimeout);anims.splice(0).forEach(a=>{try{a.cancel()}catch(e){}});document.body.classList.remove('final');vortex.classList.remove('vortexOn');document.getElementById('hotTrace').style.opacity='0';ids.forEach(id=>{els[id].style.opacity='0';els[id].style.transform='none'})}function later(ms,fn){timers.push(setTimeout(fn,ms))}function show(id,ms,from,dur=2100){later(ms,()=>{phase.textContent=id==='wingL'||id==='wingR'?'WING MEMBRANE':id.toUpperCase();const el=els[id];el.style.opacity='1';if(el.animate)anims.push(el.animate([{opacity:0,transform:from},{opacity:1,transform:'translate(0,0) scale(1)'}],{duration:dur,fill:'forwards',easing:'cubic-bezier(.16,.75,.18,1)'}))})}function run(){stop();phase.textContent='VOID';later(2400,()=>{phase.textContent='ANOMALY / VORTEX';vortex.classList.add('vortexOn')});show('legs',5900,'translate(0,240px) scale(.55)',2400);show('torso',8800,'translate(0,100px) scale(.55)',2400);show('arms',11600,'scale(.55)',2300);show('head',14200,'translate(0,-170px) scale(.5)',2200);show('horns',16600,'translate(0,-210px) scale(.4)',2200);show('wingBones',19400,'scale(.25,.72)',3200);show('wingL',22900,'translate(230px,40px) scale(.28,.7)',3900);show('wingR',22900,'translate(-230px,40px) scale(.28,.7)',3900);show('debris',27900,'translate(0,180px) scale(.55)',2400);later(31200,()=>{phase.textContent='FINAL FORM / LIGHT ABSORPTION';const h=document.getElementById('hotTrace');h.style.opacity='.24';if(h.animate)anims.push(h.animate([{opacity:0},{opacity:.24}],{duration:2200,fill:'forwards'}))});later(35600,()=>{phase.textContent='WINGS SPREAD · LIGHT FADES';document.getElementById('hotTrace').style.opacity='.08';[els.wingL,els.wingR,els.wingBones].forEach(el=>el.animate&&anims.push(el.animate([{transform:'scale(1)'},{transform:'scale(1.018)'},{transform:'scale(1)'}],{duration:4300,easing:'ease-in-out'}))) });later(43000,run)}document.getElementById('restart').onclick=run;document.getElementById('final').onclick=()=>{stop();document.body.classList.add('final');phase.textContent='FINAL FORM';document.getElementById('hotTrace').style.opacity='.24'};run()}catch(e){console.error(e);load.textContent='PARTICLE MODE ERROR — '+e.message}})();
