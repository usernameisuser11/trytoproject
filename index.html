<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Demon Particle Absorption v15</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font:12px system-ui,-apple-system,"Segoe UI",sans-serif}#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#fff}#hud{position:fixed;left:14px;top:14px;z-index:3;padding:9px 11px;border:1px solid rgba(70,18,12,.14);border-radius:9px;background:rgba(255,255,255,.88);box-shadow:0 5px 22px rgba(0,0,0,.04);color:#321713;line-height:1.42;opacity:.48;transition:.18s;backdrop-filter:blur(5px)}#hud:hover{opacity:1}#hud b{display:block;color:#561b14;letter-spacing:.07em;margin-bottom:2px}#phase{color:#9c2117}button{margin-top:7px;margin-right:5px;padding:5px 9px;border:1px solid rgba(95,25,18,.20);background:#fff;color:#3c211d;font:inherit;cursor:pointer}#error{display:none;position:fixed;inset:0;z-index:9;place-items:center;background:#fff;color:#8c1e13;text-align:center;padding:24px}</style></head><body><canvas id="gl"></canvas><div id="hud"><b>DEMON — ABSORPTION v15</b><div id="phase">1. 공허</div><div id="stats">sampling continuous particle field…</div><button id="restart">Restart</button><button id="final">Final Form</button></div><div id="error"></div><script>
const COUNT=30000;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const canvas=document.getElementById('gl'),phaseEl=document.getElementById('phase'),statsEl=document.getElementById('stats'),errEl=document.getElementById('error');

async function loadReference(){
  const parts=[0,1,2,3,4].map(i=>`demon_trace/v14ref3/part${i}.txt`);const ss=await Promise.all(parts.map(async p=>{const r=await fetch(p+'?v=15',{cache:'no-store'});if(!r.ok)throw Error('REFERENCE '+p+' '+r.status);return (await r.text()).trim()}));return imgDataFromBase64('data:image/webp;base64,'+ss.join(''));
}
function imgDataFromBase64(src){
  return new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas'); c.width=im.width; c.height=im.height;
      const x=c.getContext('2d',{willReadFrequently:true});
      if(!x) return reject(Error('REFERENCE CANVAS ERROR'));
      x.drawImage(im,0,0);
      resolve({w:im.width,h:im.height,data:x.getImageData(0,0,im.width,im.height).data});
    };
    im.onerror=()=>reject(Error('REFERENCE DECODE ERROR'));
    im.src=src;
  });
}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function buildField(ref){
  const {w,h,data}=ref,n=w*h,dark=new Float32Array(n),red=new Float32Array(n),integ=new Float64Array((w+1)*(h+1));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x,o=i*4,R=data[o]/255,G=data[o+1]/255,B=data[o+2]/255,L=.2126*R+.7152*G+.0722*B;
    dark[i]=1-L; red[i]=Math.max(0,R-.55*(G+B));
  }
  for(let y=0;y<h;y++){
    let row=0;
    for(let x=0;x<w;x++){row+=dark[y*w+x];integ[(y+1)*(w+1)+x+1]=integ[y*(w+1)+x+1]+row}
  }
  const box=(x,y,r)=>{
    const x0=Math.max(0,x-r),x1=Math.min(w-1,x+r),y0=Math.max(0,y-r),y1=Math.min(h-1,y+r),W=w+1;
    const s=integ[(y1+1)*W+x1+1]-integ[y0*W+x1+1]-integ[(y1+1)*W+x0]+integ[y0*W+x0];
    return s/((x1-x0+1)*(y1-y0+1));
  };
  const d1=new Float32Array(n),d2=new Float32Array(n),edge=new Float32Array(n),weight=new Float32Array(n);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;d1[i]=box(x,y,2);d2[i]=box(x,y,5)}
  let emax=.0001;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,gx=(d1[i+1]-d1[i-1])*.5,gy=(d1[i+w]-d1[i-w])*.5,e=Math.hypot(gx,gy);edge[i]=e;if(e>emax)emax=e}
  for(let i=0;i<n;i++)edge[i]=Math.min(1,edge[i]/(emax*.55));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x,k=.08+.92*clamp((d2[i]-.008)/(.055-.008));
    let ww=.40*Math.sqrt(d1[i])+.25*Math.sqrt(d2[i])+.18*dark[i]+.18*edge[i]+.34*red[i];
    ww*=Math.max(k,clamp(red[i]*5));
    if(y<10)ww=0;
    weight[i]=ww;
  }
  return {w,h,dark,red,weight};
}
function bilerp(a,w,h,x,y){
  const x0=Math.floor(x),y0=Math.floor(y);if(x0<0||y0<0||x0>=w-1||y0>=h-1)return 0;
  const fx=x-x0,fy=y-y0,i=y0*w+x0;
  return ((a[i]*(1-fx)+a[i+1]*fx)*(1-fy)+(a[i+w]*(1-fx)+a[i+w+1]*fx)*fy);
}
function samplePoints(f){
  const {w,h,weight,dark,red}=f,rng=mulberry32(0xD3A10F15),cell=.90,gw=Math.ceil(w/cell)+1,gh=Math.ceil(h/cell)+1,grid=new Int32Array(gw*gh);grid.fill(-1);
  const px=new Float32Array(COUNT),py=new Float32Array(COUNT),tone=new Float32Array(COUNT),hot=new Float32Array(COUNT),size=new Float32Array(COUNT),seed=new Float32Array(COUNT);
  let n=0,tries=0;
  while(n<COUNT&&tries<1500000){
    tries++;const x=1+rng()*(w-3),y=10+rng()*(h-12),wt=bilerp(weight,w,h,x,y),prob=Math.min(1,Math.pow(wt/.88,1.12));
    if(rng()>prob)continue;
    const md=.82+(1-Math.min(wt/.85,1))*.62,gx=Math.floor(x/cell),gy=Math.floor(y/cell);let ok=true;
    for(let yy=Math.max(0,gy-3);yy<=Math.min(gh-1,gy+3)&&ok;yy++)for(let xx=Math.max(0,gx-3);xx<=Math.min(gw-1,gx+3);xx++){
      const j=grid[yy*gw+xx];if(j<0)continue;const dx=px[j]-x,dy=py[j]-y;if(dx*dx+dy*dy<md*md){ok=false;break}
    }
    if(!ok)continue;
    px[n]=x;py[n]=y;tone[n]=clamp(bilerp(dark,w,h,x,y));hot[n]=clamp(bilerp(red,w,h,x,y)*2.4);seed[n]=rng();size[n]=clamp(.16+.66*Math.sqrt(tone[n])+.18*seed[n]);grid[gy*gw+gx]=n;n++;
  }
  if(n<COUNT)throw Error('CONTINUOUS SAMPLE COUNT '+n);
  const target=new Float32Array(COUNT*2);
  for(let i=0;i<COUNT;i++){target[i*2]=px[i]/(w-1);target[i*2+1]=py[i]/(h-1)}
  return {target,tone,hot,size,seed,tries};
}
function fail(msg){errEl.style.display='grid';errEl.textContent=msg}
function fallback2D(P){
  const x=canvas.getContext('2d');if(!x){fail('WEBGL / CANVAS UNAVAILABLE');return}
  const dpr=Math.min(devicePixelRatio||1,1.25);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;x.scale(dpr,dpr);x.fillStyle='#fff';x.fillRect(0,0,innerWidth,innerHeight);
  for(let i=0;i<COUNT;i+=2){
    const xx=(.5+(P.target[i*2]-.5)*.86)*innerWidth,yy=(.5+(P.target[i*2+1]-.5)*.90)*innerHeight,H=P.hot[i];
    x.fillStyle=H>.20?`rgb(${Math.floor(95+145*H)},8,5)`:'#140909';x.beginPath();x.arc(xx,yy,1.05+P.size[i]*1.75,0,Math.PI*2);x.fill();
  }
  phaseEl.textContent='6. 최종 모습 — 2D fallback';statsEl.textContent='15,000 continuous circular particles · 2D fallback';
}
function runWebGL(P){
  const gl=canvas.getContext('webgl',{alpha:false,antialias:true,premultipliedAlpha:false,powerPreference:'high-performance'});
  if(!gl){fallback2D(P);return}
  const VS=`precision highp float;attribute vec2 aTarget;attribute float aTone,aHot,aSize,aSeed;uniform float uP,uT,uA,uDpr;varying float vTone,vHot,vMove,vSeed;void main(){vec2 tgt=vec2((aTarget.x-.5)*1.72,(.5-aTarget.y)*1.88);vec2 aq=vec2(tgt.x*uA,tgt.y);float tr=length(aq),ta=atan(aq.y,aq.x),delay=aSeed*.055,q=clamp((uP-delay)/max(.001,.90-delay),0.,1.),t=1.-pow(1.-q,4.),turns=1.05+1.75*aSeed,orad=1.02+.63*fract(aSeed*17.731)+tr*.06,ang=ta+(1.-t)*6.2831853*turns,rad=mix(orad,tr,t);vec2 orb=vec2(cos(ang),sin(ang))*rad,p=vec2(orb.x/uA,orb.y);float suc=(1.-t)*sin(uT*(.45+aSeed*.25)+aSeed*31.)*.012;p+=normalize(vec2(-p.y,p.x)+vec2(.0001))*suc;p=mix(p,tgt,smoothstep(.91,1.,uP));gl_Position=vec4(p,0.,1.);gl_PointSize=mix(2.35,5.65,aSize)*uDpr*mix(.62,1.,smoothstep(.18,.72,uP));vTone=aTone;vHot=aHot;vMove=t;vSeed=aSeed;}`;
  const FS=`precision highp float;uniform float uP,uO;varying float vTone,vHot,vMove,vSeed;void main(){vec2 q=gl_PointCoord-.5;float d=length(q);if(d>.5)discard;float disc=1.-smoothstep(.38,.50,d),core=1.-smoothstep(.0,.30,d);vec3 pale=vec3(.76,.72,.70),charcoal=vec3(.035,.018,.016),maroon=vec3(.17,.018,.014),body=mix(charcoal,maroon,.12+.16*(1.-vTone));float darken=smoothstep(.14,.70,uP)*vMove;vec3 col=mix(pale,body,darken);float ignite=smoothstep(.58,.84,uP)*pow(vHot,.72);vec3 crack=mix(vec3(.42,.015,.008),vec3(.92,.025,.010),pow(vHot,.55));col=mix(col,crack,ignite*.94);float gate=smoothstep(vSeed*.16,vSeed*.16+.16,uP+.025),a=(.12+.88*darken)*gate*disc*uO;a*=mix(.65,1.,core);gl_FragColor=vec4(col,a);}`;
  const shader=(t,s)=>{const z=gl.createShader(t);gl.shaderSource(z,s);gl.compileShader(z);if(!gl.getShaderParameter(z,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(z)||'SHADER');return z};
  let prog;try{prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,VS));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog)||'LINK')}catch(e){fail('WEBGL SHADER ERROR — '+e.message);return}
  gl.useProgram(prog);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.disable(gl.DEPTH_TEST);
  const bind=(name,data,k)=>{const l=gl.getAttribLocation(prog,name),b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,k,gl.FLOAT,false,0,0)};
  bind('aTarget',P.target,2);bind('aTone',P.tone,1);bind('aHot',P.hot,1);bind('aSize',P.size,1);bind('aSeed',P.seed,1);
  const uP=gl.getUniformLocation(prog,'uP'),uT=gl.getUniformLocation(prog,'uT'),uA=gl.getUniformLocation(prog,'uA'),uD=gl.getUniformLocation(prog,'uDpr'),uO=gl.getUniformLocation(prog,'uO');
  let freeze=false,t0=performance.now(),elapsed=0;
  const resize=()=>{const d=Math.min(devicePixelRatio||1,1.5),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.uniform1f(uA,innerWidth/Math.max(1,innerHeight));gl.uniform1f(uD,d)};resize();addEventListener('resize',resize);
  const phase=t=>freeze?'6. 최종 모습':t<2?'1. 공허':t<7?'2. 빛 흡수':t<11.5?'3. 실루엣 응축':t<15?'4. 균열 점화':t<18.5?'5. 형상 완성':'6. 최종 모습';
  const draw=now=>{requestAnimationFrame(draw);if(!freeze){elapsed=(now-t0)/1000;if(elapsed>=26){t0=now;elapsed=0}}let q,o=1;if(freeze)q=1;else if(elapsed<2)q=0;else if(elapsed<18.5)q=(elapsed-2)/16.5;else q=1;if(!freeze&&elapsed>23)o=Math.max(0,1-(elapsed-23)/3);gl.clearColor(1,1,1,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(uP,clamp(q));gl.uniform1f(uT,now/1000);gl.uniform1f(uO,o);gl.drawArrays(gl.POINTS,0,COUNT);phaseEl.textContent=phase(elapsed)};requestAnimationFrame(draw);
  document.getElementById('restart').onclick=()=>{freeze=false;t0=performance.now();elapsed=0};document.getElementById('final').onclick=()=>{freeze=true;elapsed=18.5};
  statsEl.textContent=`30,000 continuous blue-noise round particles · ${P.tries.toLocaleString()} weighted candidates`;
}
(async()=>{try{const ref=await loadReference(),field=buildField(ref),P=samplePoints(field);runWebGL(P)}catch(e){console.error(e);fail('ERROR — '+e.message)}})();
</script></body></html>
