let state = 0x7f4a7c15;
function rand(){ state|=0; state=(state+0x6D2B79F5)|0; let t=Math.imul(state^(state>>>15),1|state); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }
const clamp01=v=>Math.max(0,Math.min(1,v));
const smooth=(a,b,x)=>{let t=clamp01((x-a)/(b-a));return t*t*(3-2*t)};

function makeSoftTexture(size=128){
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.08,'rgba(255,245,238,.98)');
  g.addColorStop(.28,'rgba(255,80,35,.34)');
  g.addColorStop(.65,'rgba(130,12,4,.055)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,size,size);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const softTex=makeSoftTexture();

function ellipsoidPoints(n,cx,cy,cz,rx,ry,rz,edgeBias=.28){
  const a=[];
  for(let i=0;i<n;i++){
    const ang=rand()*Math.PI*2;
    const u=Math.pow(rand(), edgeBias);
    const rr=Math.sqrt(u);
    const x=Math.cos(ang)*rx*rr;
    const y=Math.sin(ang)*ry*rr;
    const depth=(rand()*2-1)*rz*Math.sqrt(Math.max(0,1-rr*rr));
    a.push([cx+x,cy+y,cz+depth]);
  }
  return a;
}
function capsulePoints(n,ax,ay,bx,by,r0,r1,zSpread=1.7){
  const out=[];
  const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  for(let i=0;i<n;i++){
    const t=Math.pow(rand(),.92),r=lerp(r0,r1,t)*Math.sqrt(rand()),side=(rand()*2-1)*r;
    let x=lerp(ax,bx,t)+nx*side,y=lerp(ay,by,t)+ny*side;
    y += Math.sin(t*Math.PI)*(.6*(rand()-.5));
    out.push([x,y,(rand()*2-1)*zSpread]);
  }
  return out;
}
function bezier(p0,p1,p2,p3,t){
  const q=1-t;
  return [q*q*q*p0[0]+3*q*q*t*p1[0]+3*q*t*t*p2[0]+t*t*t*p3[0],q*q*q*p0[1]+3*q*q*t*p1[1]+3*q*t*t*p2[1]+t*t*t*p3[1]];
}
function curveTube(n,p0,p1,p2,p3,r0,r1,z=-1){
  const out=[];
  for(let i=0;i<n;i++){
    const t=rand(),p=bezier(p0,p1,p2,p3,t),q=bezier(p0,p1,p2,p3,Math.min(1,t+.002));
    const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
    const r=lerp(r0,r1,t)*Math.pow(rand(),.55),s=(rand()*2-1)*r;
    out.push([p[0]+nx*s,p[1]+ny*s,z+(rand()-.5)*r*.8]);
  }
  return out;
}
function edgeCurve(n,p0,p1,p2,p3,z=-2){
  const out=[];
  for(let i=0;i<n;i++){
    const t=(i+rand()*.6)/n,p=bezier(p0,p1,p2,p3,clamp01(t));
    out.push([p[0]+(rand()-.5)*.7,p[1]+(rand()-.5)*.7,z+(rand()-.5)*.8]);
  }
  return out;
}
function pointInPoly(x,y,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    const hit=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi+1e-9)+xi);if(hit)inside=!inside;
  }
  return inside;
}
function polygonPoints(n,poly,z=-4){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  poly.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);});
  const out=[];let guard=0;
  while(out.length<n&&guard<n*40){guard++;const x=lerp(minX,maxX,rand()),y=lerp(minY,maxY,rand());if(!pointInPoly(x,y,poly))continue;
    const hole=Math.sin(x*.27+y*.39+Math.sin(y*.14)*2.1);
    if(hole>.83&&rand()<.58)continue;
    if(y<-8&&rand()<.18)continue;
    out.push([x,y,z+(rand()-.5)*2.2]);
  }
  return out;
}

const vertexShader=`
attribute vec3 aTarget;
attribute vec3 aScatter;
attribute vec3 aColor;
attribute float aSeed;
attribute float aDelay;
attribute float aSize;
uniform float uTime;
uniform float uProgress;
uniform float uDissolve;
uniform float uPointScale;
uniform float uWing;
varying vec3 vColor;
varying float vAlpha;
float sat(float x){return clamp(x,0.0,1.0);} 
float easeOut(float x){x=sat(x);return 1.0-pow(1.0-x,4.0);} 
void main(){
  float localP=sat((uProgress-aDelay*.42)/.58);
  float form=easeOut(localP)*(1.0-smoothstep(.0,1.0,uDissolve));
  float breathing=sin(uTime*.62+aSeed*31.0)*.17;
  vec3 target=aTarget;
  target.x += sin(uTime*.76+aSeed*17.0)*(.08+.10*uWing);
  target.y += cos(uTime*.69+aSeed*23.0)*(.07+.08*uWing) + breathing*.08;
  if(uWing>.5){
    float flex=sin(uTime*.44+aSeed*.7)*abs(aTarget.x)*.006;
    target.y += flex*form;
    target.z += cos(uTime*.53+aSeed*10.0)*.20*form;
  }
  vec3 p=mix(aScatter,target,form);
  float pre=(1.0-form)*smoothstep(.06,.72,uProgress);
  float ang=uTime*(.18+.12*aSeed)+aSeed*6.2831;
  p.xy += vec2(cos(ang),sin(ang))*pre*(1.4+3.4*aSeed);
  vec4 mv=modelViewMatrix*vec4(p,1.0);
  float tw=1.0+sin(uTime*(1.2+aSeed*.9)+aSeed*90.0)*.17;
  gl_PointSize=clamp(aSize*uPointScale*tw*(145.0/max(1.0,-mv.z)),1.0,8.0);
  gl_Position=projectionMatrix*mv;
  vColor=aColor;
  vAlpha=mix(.16,1.0,form);
}`;
const fragmentShader=`
varying vec3 vColor;
varying float vAlpha;
uniform float uOpacity;
void main(){
  vec2 q=gl_PointCoord-.5;float d=length(q);if(d>.5)discard;
  float core=smoothstep(.5,.08,d);
  float glow=smoothstep(.5,.0,d);
  float a=(core*.72+glow*.28)*uOpacity*vAlpha;
  gl_FragColor=vec4(vColor*(.76+glow*.50),a);
}`;

function makeGroup(targets,opt={}){
  const n=targets.length;
  const target=new Float32Array(n*3),scatter=new Float32Array(n*3),color=new Float32Array(n*3),seed=new Float32Array(n),delay=new Float32Array(n),size=new Float32Array(n),position=new Float32Array(n*3);
  const xs=targets.map(p=>p[0]),ys=targets.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  for(let i=0;i<n;i++){
    const p=targets[i],k=i*3,s=rand();
    target[k]=p[0];target[k+1]=p[1];target[k+2]=p[2]||0;
    const a=rand()*Math.PI*2,r=lerp(opt.scatterMin||55,opt.scatterMax||118,Math.pow(rand(),.48));
    scatter[k]=Math.cos(a)*r + (rand()-.5)*22;
    scatter[k+1]=(rand()-.5)*(opt.scatterY||105);
    scatter[k+2]=(rand()-.5)*38-6;
    position[k]=scatter[k];position[k+1]=scatter[k+1];position[k+2]=scatter[k+2];
    let c=opt.color?opt.color(p,i,s):[.55,.03,.012];
    color[k]=c[0];color[k+1]=c[1];color[k+2]=c[2];
    seed[i]=s;
    let d;
    if(opt.delayMode==='up') d=clamp01((p[1]-minY)/(maxY-minY+1e-6))*.82+rand()*.18;
    else if(opt.delayMode==='out') d=clamp01((Math.abs(p[0])-Math.min(Math.abs(minX),Math.abs(maxX)))/(Math.max(Math.abs(minX),Math.abs(maxX))+1e-6))*.86+rand()*.14;
    else d=rand();
    delay[i]=clamp01(d);
    size[i]=lerp(opt.sizeMin||.75,opt.sizeMax||1.65,Math.pow(rand(),1.7));
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(position,3));
  g.setAttribute('aTarget',new THREE.BufferAttribute(target,3));
  g.setAttribute('aScatter',new THREE.BufferAttribute(scatter,3));
  g.setAttribute('aColor',new THREE.BufferAttribute(color,3));
  g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  g.setAttribute('aDelay',new THREE.BufferAttribute(delay,1));
  g.setAttribute('aSize',new THREE.BufferAttribute(size,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0},uProgress:{value:0},uDissolve:{value:0},uPointScale:{value:opt.pointScale||3.3},uOpacity:{value:opt.opacity??.8},uWing:{value:opt.wing?1:0}},
    vertexShader,fragmentShader,vertexColors:false,transparent:true,depthWrite:false,
    blending:opt.additive?THREE.AdditiveBlending:THREE.NormalBlending
  });
  const pts=new THREE.Points(g,m);scene.add(pts);return {pts,mat:m,n};
}

function range(t,a,b){return smooth(a,b,t)}
function phaseName(t){
  if(t<4.5)return 'VOID — embers in the dark';
  if(t<10.8)return 'BODY — ash is taking human form';
  if(t<14.8)return 'HORNS — crown of the abyss';
  if(t<20.5)return 'WING BONES — violent expansion';
  if(t<26.2)return 'MEMBRANES — darkness fills the frame';
  if(t<30.5)return 'EYES — the figure awakens';
  if(t<35.5)return 'ABSORPTION — light is pulled inward';
  return 'COLLAPSE — return to the void';
}
function setProgress(obj,v,d=0){obj.mat.uniforms.uProgress.value=clamp01(v);obj.mat.uniforms.uDissolve.value=clamp01(d)}

function update(t,dt){
  const final=forcedFinal;
  const bodyP=final?1:range(t,4.1,11.2),hornP=final?1:range(t,10.2,15.1),boneP=final?1:range(t,13.7,19.0),memP=final?1:range(t,17.7,26.0),rimP=final?1:range(t,14.6,21.2),crackP=final?1:range(t,8.7,17.5);
  const dissolve=final?0:range(t,35.6,39.5);
  setProgress(body,bodyP,dissolve);setProgress(horns,hornP,dissolve);setProgress(wingBones,boneP,dissolve);setProgress(wingMem,memP,dissolve);setProgress(wingRims,rimP,dissolve);setProgress(cracks,crackP,dissolve);
  for(const o of [body,horns,wingBones,wingMem,wingRims,cracks])o.mat.uniforms.uTime.value=t;

  const eyeP=final?1:range(t,25.2,28.8)*(1-dissolve);
  eyeCore.material.opacity=.95*eyeP;
  for(const s of eyes.children)s.material.opacity=.24*eyeP*(.82+.18*Math.sin(t*3.6));

  const wingImpact=final?0:Math.exp(-Math.pow((t-18.2)/.72,2));
  flash.style.opacity=String(Math.min(.46,wingImpact*.38));
  coreAura.material.opacity=(.035+.07*bodyP+.085*eyeP+.06*wingImpact)*(1-dissolve);
  coreAura.scale.setScalar(66+bodyP*15+eyeP*8+Math.sin(t*.7)*1.5);
  backAuraL.material.opacity=backAuraR.material.opacity=(.015+.05*memP+.04*wingImpact)*(1-dissolve);

  const suction=final?.82:range(t,27.4,34.8)*(1-dissolve);
  for(let i=0;i<AN;i++){
    const k=i*3,s=aseed[i],bx=abase[k],by=abase[k+1],bz=abase[k+2];
    const br=Math.hypot(bx,by),ba=Math.atan2(by,bx);
    const cyc=(s+t*(.022+.018*s))%1;
    const pull=1-suction*(.18+.72*cyc);
    const ang=ba+t*(.018+.028*s)+suction*cyc*2.3;
    ap[k]=Math.cos(ang)*br*pull;
    ap[k+1]=Math.sin(ang)*br*pull*.72 + by*.28 + Math.sin(t*.7+s*30)*1.2;
    ap[k+2]=bz + Math.sin(t*.5+s*50)*2.0;
  }
  ag.attributes.position.needsUpdate=true;
  am.opacity=.16+.20*(1-dissolve)+.10*suction;

  for(let i=0;i<FN;i++){
    const k=i*3,cycle=(i/FN+t*.035)%1;
    const rise=cycle*34;
    fp[k]=fbase[k]*(1-.50*suction*cycle)+Math.sin(t*.8+i*.02)*.8;
    fp[k+1]=fbase[k+1]+rise;
    fp[k+2]=fbase[k+2]+Math.cos(t*.7+i*.015)*1.1;
  }
  fg.attributes.position.needsUpdate=true;
  floorAsh.material.opacity=(.10+.28*bodyP)*(1-dissolve);

  camera.position.z=142-Math.sin(t*.25)*.55-range(t,16,20)*1.4+range(t,33,36)*.6;
  camera.lookAt(0,-1,0);

  phaseEl.textContent=final?'FINAL FORM — manual preview':phaseName(t);
  progressEl.style.width=((final?1:t/TOTAL)*100).toFixed(1)+'%';
  const sec=Math.floor(final?TOTAL:t),mm=String(Math.floor(sec/60)).padStart(2,'0'),ss=String(sec%60).padStart(2,'0');clockEl.textContent=`${mm}:${ss} / 00:40`;
}

function animate(now){
  requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&!forcedFinal){simTime+=dt;if(simTime>=TOTAL)simTime=0;}
  update(forcedFinal?32:simTime,dt);composer.render();
}
requestAnimationFrame(animate);

function restart(){forcedFinal=false;simTime=0;playing=true;document.getElementById('pause').textContent='Pause'}
function togglePause(){playing=!playing;document.getElementById('pause').textContent=playing?'Pause':'Play'}
function finalForm(){forcedFinal=!forcedFinal;if(forcedFinal)playing=false;else {playing=true;simTime=0}document.getElementById('formed').textContent=forcedFinal?'Resume':'Final Form'}
document.getElementById('pause').onclick=togglePause;document.getElementById('restart').onclick=restart;document.getElementById('formed').onclick=finalForm;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePause()}else if(e.key==='r'||e.key==='R')restart();else if(e.key==='f'||e.key==='F')finalForm();else if(e.key==='h'||e.key==='H')hud.style.display=hud.style.display==='none'?'block':'none'});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script>
</body>
