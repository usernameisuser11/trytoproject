<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Demon Pixel Trace v8 Safe</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#d8bbb3;font:12px system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(ellipse at 50% 48%,#170302 0%,#050000 44%,#000 80%)}
#scene{position:fixed;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;pointer-events:none;transform-origin:50% 50%}
#base{filter:grayscale(1) sepia(1) saturate(6.5) hue-rotate(325deg) brightness(1.55) contrast(1.45);opacity:.96;animation:formBase 5.8s cubic-bezier(.18,.7,.18,1) both}
#glow{filter:grayscale(1) sepia(1) saturate(7.5) hue-rotate(325deg) brightness(2.05) contrast(1.55) blur(2.2px);mix-blend-mode:screen;opacity:.27;animation:formGlow 6.5s cubic-bezier(.18,.7,.18,1) both, pulse 4.4s ease-in-out 6.5s infinite}
#hot{filter:grayscale(1) sepia(1) saturate(8.5) hue-rotate(325deg) brightness(2.5) contrast(1.9);mix-blend-mode:screen;opacity:.20;animation:formHot 7s cubic-bezier(.18,.7,.18,1) both, flicker 3.1s ease-in-out 7s infinite}
#scene.final .layer{animation:none!important;transform:none!important}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:20;color:#bd5947;letter-spacing:.13em;text-align:center}
#hud{position:fixed;left:14px;top:14px;z-index:10;padding:10px 12px;background:#080101c9;border:1px solid #ff4a302f;backdrop-filter:blur(6px);line-height:1.55;min-width:275px}
b{display:block;color:#ff765e;letter-spacing:.08em}#mode{color:#e7a195}#stats{opacity:.72}
button{margin-top:7px;margin-right:5px;padding:5px 9px;border:1px solid #ff563b42;background:#1a0403;color:#dec0b8;font:inherit;cursor:pointer}
@keyframes formBase{0%{opacity:.03;transform:scale(.89)}35%{opacity:.34}70%{opacity:.88;transform:scale(.992)}100%{opacity:.96;transform:none}}
@keyframes formGlow{0%{opacity:0;transform:scale(.82)}48%{opacity:.12}100%{opacity:.27;transform:none}}
@keyframes formHot{0%,42%{opacity:0;transform:scale(.95)}100%{opacity:.20;transform:none}}
@keyframes pulse{0%,100%{opacity:.20}50%{opacity:.34}}
@keyframes flicker{0%,100%{opacity:.15}45%{opacity:.24}53%{opacity:.18}70%{opacity:.26}}
</style></head>
<body>
<div id="load">LOADING 115K TRACE SAFE MODE…</div>
<div id="scene"></div>
<div id="hud"><b>DEMON — PIXEL TRACE v8</b><div id="mode">SAFE TRACE MODE</div><div id="stats">115k extracted particle map · no Canvas · no WebGL</div><button id="final">Final Form</button><button id="restart">Restart</button></div>
<script>
(async()=>{'use strict';
const load=document.getElementById('load'),scene=document.getElementById('scene');
try{
 const files=['demon_v6/part0.txt','demon_v6/part1.txt','demon_v6/part2.txt','demon_v6/part3_fixed.txt'];
 const parts=await Promise.all(files.map(async p=>{const r=await fetch(p+'?safe=8',{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.text()}));
 const m=parts.join('').match(/const MAP='(data:image\/webp;base64,[^']+)'/);
 if(!m)throw Error('TRACE MAP NOT FOUND');
 const src=m[1];
 for(const [id,cls] of [['base','layer'],['glow','layer'],['hot','layer']]){
   const im=new Image();im.id=id;im.className=cls;im.src=src;scene.appendChild(im);
 }
 await new Promise((resolve,reject)=>{const im=document.getElementById('base');if(im.complete)resolve();else{im.onload=resolve;im.onerror=()=>reject(Error('TRACE IMAGE ERROR'))}});
 load.remove();
 document.getElementById('final').onclick=()=>scene.classList.toggle('final');
 document.getElementById('restart').onclick=()=>{scene.classList.remove('final');const nodes=[...scene.children];nodes.forEach(n=>n.style.animation='none');void scene.offsetWidth;nodes.forEach(n=>n.style.animation='')};
}catch(e){console.error(e);load.textContent='SAFE MODE ERROR — '+e.message}
})();
</script></body></html>
