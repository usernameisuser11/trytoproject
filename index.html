<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Demon Absorption Presence v16</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font:12px system-ui,-apple-system,"Segoe UI",sans-serif}#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#fff}#hud{position:fixed;left:14px;top:14px;z-index:3;padding:9px 11px;border:1px solid rgba(70,18,12,.14);border-radius:9px;background:rgba(255,255,255,.88);box-shadow:0 5px 22px rgba(0,0,0,.04);color:#321713;line-height:1.42;opacity:.48;transition:.18s;backdrop-filter:blur(5px)}#hud:hover{opacity:1}#hud b{display:block;color:#561b14;letter-spacing:.07em;margin-bottom:2px}#phase{color:#9c2117}button{margin-top:7px;margin-right:5px;padding:5px 9px;border:1px solid rgba(95,25,18,.20);background:#fff;color:#3c211d;font:inherit;cursor:pointer}#error{display:none;position:fixed;inset:0;z-index:9;place-items:center;background:#fff;color:#8c1e13;text-align:center;padding:24px}</style></head><body><canvas id="gl"></canvas><div id="hud"><b>DEMON — ABSORPTION + PRESENCE v16</b><div id="phase">1. 공허</div><div id="stats">sampling continuous particle field…</div><button id="restart">Restart</button><button id="final">Final Form</button></div><div id="error"></div><script>
const COUNT=30000;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const canvas=document.getElementById('gl'),phaseEl=document.getElementById('phase'),statsEl=document.getElementById('stats'),errEl=document.getElementById('error');

async function loadReference(){
  const parts=[0,1,2,3,4].map(i=>`demon_trace/v14ref3/part${i}.txt`);const ss=await Promise.all(parts.map(async p=>{const r=await fetch(p+'?v=15',{cache:'no-store'});if(!r.ok)throw Error('REFERENCE '+p+' '+r.status);return (await r.text()).trim()}));return imgDataFromBase64('data:image/webp;base64,'+ss.join(''));
}
function imgDataFromBase64(src){
  return new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas'); c.width=im.width; c.height=im.height;
      const x=c.getContext('2d',{willReadFrequently:true});
      if(!x) return reject(Error('REFERENCE CANVAS ERROR'));
      x.drawImage(im,0,0);
      resolve({w:im.width,h:im.height,data:x.getImageData(0,0,im.width,im.height).data});
    };
    im.onerror=()=>reject(Error('REFERENCE DECODE ERROR'));
    im.src=src;
  });
}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function buildField(ref){
  const {w,h,data}=ref,n=w*h,dark=new Float32Array(n),red=new Float32Array(n),integ=new Float64Array((w+1)*(h+1));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x,o=i*4,R=data[o]/255,G=data[o+1]/255,B=data[o+2]/255,L=.2126*R+.7152*G+.0722*B;
    dark[i]=1-L; red[i]=Math.max(0,R-.55*(G+B));
  }
  for(let y=0;y<h;y++){
    let row=0;
    for(let x=0;x<w;x++){row+=dark[y*w+x];integ[(y+1)*(w+1)+x+1]=integ[y*(w+1)+x+1]+row}
  }
  const box=(x,y,r)=>{
    const x0=Math.max(0,x-r),x1=Math.min(w-1,x+r),y0=Math.max(0,y-r),y1=Math.min(h-1,y+r),W=w+1;
    const s=integ[(y1+1)*W+x1+1]-integ[y0*W+x1+1]-integ[(y1+1)*W+x0]+integ[y0*W+x0];

  };

  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,gx=(d1[i+1]-d1[i-1])*.5,gy=(d1[i+w]-d1[i-w])*.5,e=Math.hypot(gx,gy);edge[i]=e;if(e>emax)emax=e}

  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x,k=.08+.92*clamp((d2[i]-.008)/(.055-.008));
    let ww=.40*Math.sqrt(d1[i])+.25*Math.sqrt(d2[i])+.18*dark[i]+.18*edge[i]+.34*red[i];
    ww*=Math.max(k,clamp(red[i]*5));
    if(y<10)ww=0;
    weight[i]=ww;
  }
  return {w,h,dark,red,weight};
}
function bilerp(a,w,h,x,y){
  const x0=Math.floor(x),y0=Math.floor(y);if(x0<0||y0<0||x0>=w-1||y0>=h-1)return 0;
  const fx=x-x0,fy=y-y0,i=y0*w+x0;
  return ((a[i]*(1-fx)+a[i+1]*fx)*(1-fy)+(a[i+w]*(1-fx)+a[i+w+1]*fx)*fy);
}
function samplePoints(f){
  const {w,h,weight,dark,red}=f,rng=mulberry32(0xD3A10F15),cell=.90,gw=Math.ceil(w/cell)+1,gh=Math.ceil(h/cell)+1,grid=new Int32Array(gw*gh);grid.fill(-1);
  const px=new Float32Array(COUNT),py=new Float32Array(COUNT),tone=new Float32Array(COUNT),hot=new Float32Array(COUNT),size=new Float32Array(COUNT),seed=new Float32Array(COUNT);
  let n=0,tries=0;
  while(n<COUNT&&tries<1500000){
    tries++;const x=1+rng()*(w-3),y=10+rng()*(h-12),wt=bilerp(weight,w,h,x,y),prob=Math.min(1,Math.pow(wt/.88,1.12));

      const j=grid[yy*gw+xx];if(j<0)continue;const dx=px[j]-x,dy=py[j]-y;if(dx*dx+dy*dy<md*md){ok=false;break}
    }
    if(!ok)continue;
    px[n]=x;py[n]=y;tone[n]=clamp(bilerp(dark,w,h,x,y));hot[n]=clamp(bilerp(red,w,h,x,y)*2.4);seed[n]=rng();size[n]=clamp(.16+.66*Math.sqrt(tone[n])+.18*seed[n]);grid[gy*gw+gx]=n;n++;

  if(n<COUNT)throw Error('CONTINUOUS SAMPLE COUNT '+n);
  const target=new Float32Array(COUNT*2);
  for(let i=0;i<COUNT;i++){target[i*2]=px[i]/(w-1);target[i*2+1]=py[i]/(h-1)}

}
function fail(msg){errEl.style.display='grid';errEl.textContent=msg}

  let freeze=false,t0=performance.now(),elapsed=0,lastW=0,lastH=0;

  const ease=t=>1-Math.pow(1-clamp(t),4),phase=t=>freeze?'6. 최종 모습':t<2?'1. 공허':t<6?'2. 빛 흡수':t<9?'3. 실루엣 응축':t<11?'4. 균열 점화':t<23?'5. 형상 완성 / 위압 유지':'6. 최종 모습';
  const draw=now=>{requestAnimationFrame(draw);resize();if(!freeze){elapsed=(now-t0)/1000;if(elapsed>=26){t0=now;elapsed=0}}const dpr=canvas.width/Math.max(1,innerWidth),w=innerWidth,h=innerHeight,cx=w*.5,cy=h*.5;let q=1,fade=1;if(!freeze){q=elapsed<2?0:elapsed<11?clamp((elapsed-2)/9):1;if(elapsed>24)fade=clamp(1-(elapsed-24)/2)}x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#fff';x.fillRect(0,0,w,h);const final=freeze||q>.999;const breathe=final?Math.sin(now*.001*1.65)*.006:0,wingPulse=final?Math.sin(now*.001*.55+.7)*.008:0;
    for(let i=0;i<COUNT;i+=2){const s=P.seed[i],tx=(.5+(P.target[i*2]-.5)*.86)*w,ty=(.5+(P.target[i*2+1]-.5)*.90)*h,dx=tx-cx,dy=ty-cy,tr=Math.hypot(dx,dy),ta=Math.atan2(dy,dx),delay=s*.055,t=ease((q-delay)/Math.max(.001,.90-delay)),turns=1.05+1.75*s,sr=Math.max(w,h)*(.56+.30*((s*17.731)%1))+tr*.06,ang=ta+(1-t)*Math.PI*2*turns,rad=sr*(1-t)+tr*t;let px=cx+Math.cos(ang)*rad,py=cy+Math.sin(ang)*rad;const ax=Math.abs((tx-cx)/(w*.5)),yn=(cy-ty)/(h*.5),wing=ax>.34&&yn>-.25?clamp((ax-.34)/.5):0,body=(1-clamp(ax/.34))*clamp(1-Math.abs(yn+.03)/.62);px+=(tx-cx)*breathe*body+Math.sign(tx-cx||1)*w*wingPulse*.012*wing;py+=(ty-cy)*breathe*body+h*Math.sin(now*.001*.55+1.1)*.0025*wing;const hot=P.hot[i],dark=clamp((q-.12)/.62)*t,ignite=clamp((q-.72)/.25)*Math.pow(hot,.72),pulse=.90+.10*Math.sin(now*.001*1.7+s*3.1);let r,g,b;if(ignite>.01){r=70+175*Math.pow(hot,.55)*pulse;g=6;b=3}else{const v=185*(1-dark)+18*dark;r=v;g=v*.94;b=v*.92}x.globalAlpha=fade*(.10+.90*dark);x.fillStyle=`rgb(${r|0},${g|0},${b|0})`;x.beginPath();x.arc(px,py,(1.05+P.size[i]*1.55)*(final?1+.015*Math.sin(now*.001*1.6+s*5):1),0,Math.PI*2);x.fill()}x.globalAlpha=1;phaseEl.textContent=phase(elapsed)};requestAnimationFrame(draw);
  document.getElementById('restart').onclick=()=>{freeze=false;t0=performance.now();elapsed=0};document.getElementById('final').onclick=()=>{freeze=true;elapsed=11};statsEl.textContent='15,000 continuous circular particles · animated 2D fallback';
}
function runWebGL(P){
  const gl=canvas.getContext('webgl',{alpha:false,antialias:true,premultipliedAlpha:false,powerPreference:'high-performance'});
  if(!gl){fallback2D(P);return}
  const VS=`precision highp float;attribute vec2 aTarget;attribute float aTone,aHot,aSize,aSeed;uniform float uP,uT,uA,uDpr;varying float vTone,vHot,vMove,vSeed;void main(){vec2 tgt=vec2((aTarget.x-.5)*1.72,(.5-aTarget.y)*1.88);vec2 aq=vec2(tgt.x*uA,tgt.y);float tr=length(aq),ta=atan(aq.y,aq.x),delay=aSeed*.055,q=clamp((uP-delay)/max(.001,.90-delay),0.,1.),t=1.-pow(1.-q,4.),turns=1.05+1.75*aSeed,orad=1.02+.63*fract(aSeed*17.731)+tr*.06,ang=ta+(1.-t)*6.2831853*turns,rad=mix(orad,tr,t);vec2 orb=vec2(cos(ang),sin(ang))*rad,p=vec2(orb.x/uA,orb.y);float suc=(1.-t)*sin(uT*(.45+aSeed*.25)+aSeed*31.)*.012;p+=normalize(vec2(-p.y,p.x)+vec2(.0001))*suc;float final=smoothstep(.965,1.,uP);float ax=abs(tgt.x),wing=smoothstep(.34,.74,ax)*smoothstep(-.26,.20,tgt.y),body=(1.-smoothstep(.18,.43,ax))*(1.-smoothstep(.48,.86,abs(tgt.y+.04)));float breath=sin(uT*1.65+aSeed*.12)*.0065*body*final;p+=tgt*breath;float tension=sin(uT*.55+.72)*.0085*wing*final;p.x+=sign(tgt.x)*tension;p.y+=sin(uT*.55+1.15)*.0030*wing*final;float residual=step(.968,aSeed)*final;vec2 tang=normalize(vec2(-tgt.y,tgt.x)+vec2(.0001));p+=tang*sin(uT*(.42+.18*aSeed)+aSeed*29.)*.010*residual;p=mix(p,tgt,smoothstep(.91,.985,uP)*(1.-final));gl_Position=vec4(p,0.,1.);float live=1.+final*(.018*sin(uT*1.55+aSeed*6.));gl_PointSize=mix(2.35,5.65,aSize)*uDpr*mix(.62,1.,smoothstep(.18,.72,uP))*live;vTone=aTone;vHot=aHot;vMove=t;vSeed=aSeed;}`;

  const shader=(t,s)=>{const z=gl.createShader(t);gl.shaderSource(z,s);gl.compileShader(z);if(!gl.getShaderParameter(z,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(z)||'SHADER');return z};

  let freeze=false,t0=performance.now(),elapsed=0;
  const resize=()=>{const d=Math.min(devicePixelRatio||1,1.5),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.uniform1f(uA,innerWidth/Math.max(1,innerHeight));gl.uniform1f(uD,d)};resize();addEventListener('resize',resize);
