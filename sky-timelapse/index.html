<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sky Timelapse</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020712}
canvas{display:block}
#phase{position:fixed;left:24px;bottom:20px;color:rgba(255,255,255,.7);font-family:Arial,sans-serif;font-size:13px;letter-spacing:.12em;pointer-events:none;text-shadow:0 1px 8px #000}
#status{position:fixed;inset:0;display:grid;place-items:center;color:#dce9ff;font:14px Arial,sans-serif;letter-spacing:.08em;background:#020712;z-index:10;transition:opacity .5s ease}
</style>
</head>
<body>
<div id="status">LOADING SKY…</div>
<div id="phase"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const status=document.querySelector('#status');
try{
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000);
camera.position.set(0,10,45);camera.lookAt(0,9,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
const CLOCK_DURATION=120;let startTime=performance.now();
function timeline(){return((performance.now()-startTime)/1000%CLOCK_DURATION)/CLOCK_DURATION}
function smooth(a,b,x){x=THREE.MathUtils.clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)}
const skyGeo=new THREE.PlaneGeometry(360,210);
const skyMat=new THREE.ShaderMaterial({depthWrite:false,uniforms:{uTime:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`precision highp float;varying vec2 vUv;uniform float uTime;void main(){float y=vUv.y;float t=uTime;vec3 top;vec3 horizon;if(t<.14){float k=t/.14;top=mix(vec3(.025,.055,.18),vec3(.25,.52,.82),k);horizon=mix(vec3(.65,.36,.67),vec3(.95,.72,.56),k);}else if(t<.30){float k=(t-.14)/.16;top=mix(vec3(.25,.52,.82),vec3(.16,.55,.89),k);horizon=mix(vec3(.95,.72,.56),vec3(.69,.87,.98),k);}else if(t<.50){float k=(t-.30)/.20;top=mix(vec3(.16,.55,.89),vec3(.10,.48,.85),k);horizon=mix(vec3(.69,.87,.98),vec3(.63,.82,.95),k);}else if(t<.68){float k=(t-.50)/.18;top=mix(vec3(.10,.48,.85),vec3(.31,.25,.60),k);horizon=mix(vec3(.63,.82,.95),vec3(1.0,.40,.28),k);}else if(t<.80){float k=(t-.68)/.12;top=mix(vec3(.31,.25,.60),vec3(.025,.075,.22),k);horizon=mix(vec3(1.0,.40,.28),vec3(.21,.22,.48),k);}else if(t<.97){float k=(t-.80)/.17;top=mix(vec3(.025,.075,.22),vec3(.008,.018,.07),k);horizon=mix(vec3(.21,.22,.48),vec3(.035,.09,.19),k);}else{float k=(t-.97)/.03;top=mix(vec3(.008,.018,.07),vec3(.025,.055,.18),k);horizon=mix(vec3(.035,.09,.19),vec3(.65,.36,.67),k);}float h=pow(1.0-y,1.15);vec3 col=mix(top,horizon,h);float glow=exp(-pow((y-.18)*5.0,2.0));if(t>.48&&t<.72){col+=vec3(.18,.07,.03)*glow;}gl_FragColor=vec4(col,1.0);}`});
const sky=new THREE.Mesh(skyGeo,skyMat);sky.position.set(0,16,-120);scene.add(sky);
const sunMat=new THREE.MeshBasicMaterial({color:0xffefc4,transparent:true,opacity:1});const sun=new THREE.Mesh(new THREE.CircleGeometry(1.1,64),sunMat);sun.position.z=-80;scene.add(sun);
const glowTexture=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const ctx=c.getContext('2d');const g=ctx.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'rgba(255,225,160,.55)');g.addColorStop(.15,'rgba(255,190,110,.22)');g.addColorStop(1,'rgba(255,160,80,0)');ctx.fillStyle=g;ctx.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)})();
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));sunGlow.scale.set(16,16,1);scene.add(sunGlow);
function createStars(count){const positions=[],colors=[],sizes=[];for(let i=0;i<count;i++){const x=THREE.MathUtils.randFloat(-105,105),y=THREE.MathUtils.randFloat(2,65),z=THREE.MathUtils.randFloat(-85,-65);positions.push(x,y,z);const brightness=Math.random();colors.push(.55+brightness*.45,.65+brightness*.35,.85+brightness*.15);sizes.push(Math.random()<.025?THREE.MathUtils.randFloat(2.5,4.5):THREE.MathUtils.randFloat(.5,1.7));}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.setAttribute('aSize',new THREE.Float32BufferAttribute(sizes,1));const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexColors:true,blending:THREE.AdditiveBlending,uniforms:{uOpacity:{value:0},uPixelRatio:{value:renderer.getPixelRatio()},uTime:{value:0}},vertexShader:`attribute float aSize;varying vec3 vColor;uniform float uPixelRatio;uniform float uTime;void main(){vColor=color;vec4 mv=modelViewMatrix*vec4(position,1.0);float twinkle=.82+sin(uTime*1.6+position.x*1.9+position.y*.7)*.18;gl_PointSize=aSize*uPixelRatio*twinkle;gl_Position=projectionMatrix*mv;}`,fragmentShader:`varying vec3 vColor;uniform float uOpacity;void main(){vec2 p=gl_PointCoord-vec2(.5);float d=length(p);float a=smoothstep(.5,0.0,d);a*=a;gl_FragColor=vec4(vColor,a*uOpacity);}`});const points=new THREE.Points(geo,mat);scene.add(points);return points}
const stars=createStars(8500);
function createGalaxyLayer(count,spread,size){const positions=[],colors=[],sizes=[];for(let i=0;i<count;i++){const x=THREE.MathUtils.randFloat(-110,110);const centerY=32+Math.sin(x*.018)*5+x*.045;const y=centerY+THREE.MathUtils.randFloatSpread(spread);const z=THREE.MathUtils.randFloat(-78,-68);positions.push(x,y,z);const r=Math.random();if(r<.18)colors.push(1,.48+Math.random()*.22,.72+Math.random()*.18);else if(r<.55)colors.push(.55+Math.random()*.25,.65+Math.random()*.25,1);else colors.push(.82+Math.random()*.18,.85+Math.random()*.15,1);sizes.push(THREE.MathUtils.randFloat(size*.45,size));}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.setAttribute('aSize',new THREE.Float32BufferAttribute(sizes,1));const mat=new THREE.ShaderMaterial({transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,vertexColors:true,uniforms:{uOpacity:{value:0},uPixelRatio:{value:renderer.getPixelRatio()}},vertexShader:`attribute float aSize;varying vec3 vColor;uniform float uPixelRatio;void main(){vColor=color;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*uPixelRatio;gl_Position=projectionMatrix*mv;}`,fragmentShader:`varying vec3 vColor;uniform float uOpacity;void main(){vec2 uv=gl_PointCoord-.5;float d=length(uv);float a=smoothstep(.5,0.,d);a*=a;gl_FragColor=vec4(vColor,a*uOpacity);}`});const points=new THREE.Points(geo,mat);scene.add(points);return points}
const galaxyWide=createGalaxyLayer(16000,18,1.5),galaxyCore=createGalaxyLayer(12000,7,2.0);
function createGalaxyGlowTexture(){const canvas=document.createElement('canvas');canvas.width=2048;canvas.height=300;const ctx=canvas.getContext('2d');const gradient=ctx.createLinearGradient(0,150,0,0);gradient.addColorStop(0,'rgba(80,110,255,0)');gradient.addColorStop(.28,'rgba(105,130,255,.16)');gradient.addColorStop(.48,'rgba(210,190,255,.30)');gradient.addColorStop(.55,'rgba(255,210,235,.22)');gradient.addColorStop(.72,'rgba(90,120,255,.14)');gradient.addColorStop(1,'rgba(50,90,255,0)');ctx.fillStyle=gradient;ctx.fillRect(0,0,canvas.width,canvas.height);for(let i=0;i<180;i++){const x=Math.random()*canvas.width,y=80+Math.random()*140,r=20+Math.random()*80;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,Math.random()>.55?'rgba(255,160,220,.08)':'rgba(130,160,255,.10)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}const tex=new THREE.CanvasTexture(canvas);tex.colorSpace=THREE.SRGBColorSpace;return tex}
const galaxyGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:createGalaxyGlowTexture(),transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));galaxyGlow.position.set(0,33,-81);galaxyGlow.scale.set(220,28,1);galaxyGlow.material.rotation=THREE.MathUtils.degToRad(-5);scene.add(galaxyGlow);
function mountainShape(yBase,height,seed,segments=34){const shape=new THREE.Shape();shape.moveTo(-120,yBase);let prev=yBase;for(let i=0;i<=segments;i++){const x=-120+240*(i/segments);const n=Math.sin(i*.74+seed)*.48+Math.sin(i*.23+seed*2)*.33+Math.sin(i*1.63+seed)*.19;let y=yBase+height*(.50+n*.28);y=prev*.34+y*.66;prev=y;shape.lineTo(x,y);}shape.lineTo(120,-25);shape.lineTo(-120,-25);shape.closePath();return shape}
const mountains=[];[[-10,10,2,-46],[-9,11,5,-41],[-8,11,8,-36],[-7,12,11,-31],[-6,12,15,-26],[-5,13,21,-21],[-4,14,28,-16]].forEach(([base,height,seed,z],i)=>{const geo=new THREE.ShapeGeometry(mountainShape(base,height,seed));const mat=new THREE.MeshBasicMaterial({color:0x526f91,transparent:true});const mesh=new THREE.Mesh(geo,mat);mesh.position.z=z;scene.add(mesh);mountains.push({mesh,index:i});});
function forestShape(){const shape=new THREE.Shape();shape.moveTo(-120,-12);const count=190;for(let i=0;i<=count;i++){const x=-120+240*i/count;const base=-4+Math.sin(i*.14)*.7;let tree=0;if(i%3===0)tree=3+Math.random()*6;shape.lineTo(x,base+tree);}shape.lineTo(120,-30);shape.lineTo(-120,-30);shape.closePath();return shape}
const forest=new THREE.Mesh(new THREE.ShapeGeometry(forestShape()),new THREE.MeshBasicMaterial({color:0x07180f}));forest.position.z=-8;scene.add(forest);
function mistTexture(){const c=document.createElement('canvas');c.width=1024;c.height=128;const ctx=c.getContext('2d');for(let i=0;i<28;i++){const x=Math.random()*1024,y=30+Math.random()*70,r=50+Math.random()*140;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(210,230,255,.15)');g.addColorStop(1,'rgba(210,230,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}return new THREE.CanvasTexture(c)}
const mistTex=mistTexture(),mists=[];for(let i=0;i<5;i++){const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:mistTex,transparent:true,opacity:.16,depthWrite:false}));spr.position.set(THREE.MathUtils.randFloat(-50,50),THREE.MathUtils.randFloat(-1,5),-13-i*4);spr.scale.set(85,9,1);scene.add(spr);mists.push(spr)}
function cloudTexture(){const c=document.createElement('canvas');c.width=512;c.height=180;const ctx=c.getContext('2d');for(let i=0;i<18;i++){const x=50+Math.random()*410,y=50+Math.random()*70,r=25+Math.random()*55;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,.24)');g.addColorStop(.6,'rgba(230,240,255,.11)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}return new THREE.CanvasTexture(c)}
const cloudTex=cloudTexture(),clouds=[];for(let i=0;i<7;i++){const material=new THREE.SpriteMaterial({map:cloudTex,transparent:true,opacity:.16,depthWrite:false});const sprite=new THREE.Sprite(material);sprite.position.set(THREE.MathUtils.randFloat(-90,90),THREE.MathUtils.randFloat(23,47),-60-i*.4);const scale=THREE.MathUtils.randFloat(22,40);sprite.scale.set(scale,scale*.24,1);scene.add(sprite);clouds.push(sprite)}
const shootingGeo=new THREE.BufferGeometry();shootingGeo.setAttribute('position',new THREE.Float32BufferAttribute([0,0,0,-8,-3,0],3));const shootingMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0});const shooting=new THREE.Line(shootingGeo,shootingMat);shooting.position.z=-55;scene.add(shooting);let nextShooting=0;
function setMountainColors(t){mountains.forEach(m=>{const depth=m.index/mountains.length,col=new THREE.Color();if(t<.5)col.lerpColors(new THREE.Color(0x6789a6),new THREE.Color(0x234d55),depth);else if(t<.7)col.lerpColors(new THREE.Color(0x94768f),new THREE.Color(0x343350),depth);else col.lerpColors(new THREE.Color(0x304d75),new THREE.Color(0x071427),depth);m.mesh.material.color.copy(col);});}
const phaseEl=document.querySelector('#phase');function phaseName(t){if(t<.10)return'새벽';if(t<.25)return'아침';if(t<.50)return'낮';if(t<.68)return'노을';if(t<.80)return'블루아워';return'밤'}
function update(){const now=performance.now()/1000,t=timeline();skyMat.uniforms.uTime.value=t;phaseEl.textContent=phaseName(t);const sunVisible=1-smooth(.63,.70,t);sun.visible=sunVisible>.01;const sunT=smooth(.06,.68,t);sun.position.x=THREE.MathUtils.lerp(-68,68,sunT);sun.position.y=5+Math.sin(sunT*Math.PI)*34;sunGlow.position.copy(sun.position);sunGlow.material.opacity=sunVisible*.52;let starOpacity=smooth(.70,.84,t);if(t>.97)starOpacity*=1-smooth(.97,1,t);stars.material.uniforms.uOpacity.value=starOpacity;stars.material.uniforms.uTime.value=now;let galaxyOpacity=smooth(.79,.90,t);if(t>.97)galaxyOpacity*=1-smooth(.97,1,t);galaxyWide.material.uniforms.uOpacity.value=galaxyOpacity*.42;galaxyCore.material.uniforms.uOpacity.value=galaxyOpacity*.88;galaxyGlow.material.opacity=galaxyOpacity*.72;galaxyWide.rotation.z=Math.sin(now*.035)*.004;galaxyCore.rotation.z=Math.sin(now*.035)*.004;clouds.forEach((cloud,i)=>{cloud.position.x+=.0025*(i+1);if(cloud.position.x>105)cloud.position.x=-105;let opacity=.15;if(t>.78)opacity=.08;if(t>.88)opacity=.11;cloud.material.opacity=opacity;});mists.forEach((mist,i)=>{mist.position.x+=.004+i*.0006;if(mist.position.x>70)mist.position.x=-70;mist.material.opacity=t>.72?.18:.12;});setMountainColors(t);forest.material.color.lerpColors(new THREE.Color(0x0f2c1f),new THREE.Color(0x02070a),smooth(.60,.85,t));if(t>.86&&now>nextShooting){nextShooting=now+7+Math.random()*14;shooting.position.set(THREE.MathUtils.randFloat(-45,70),THREE.MathUtils.randFloat(28,55),-55);shootingMat.opacity=1;}shooting.position.x+=.22;shooting.position.y-=.09;shootingMat.opacity*=.965;}
function animate(){requestAnimationFrame(animate);update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')startTime=performance.now();});
requestAnimationFrame(()=>{status.style.opacity='0';setTimeout(()=>status.remove(),600)});
}catch(err){status.textContent='RENDER ERROR · '+err.message;console.error(err)}
})();
</script>
</body>
</html>
