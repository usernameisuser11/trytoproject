<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky Coordinate Trace v10.6 Robust</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{position:fixed;inset:0;background:#020611}
canvas{display:block;width:100%;height:100%}
#status{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#020611;color:#dce9ff;font:12px system-ui;letter-spacing:.12em;transition:opacity .35s ease}
#status.hide{opacity:0;pointer-events:none}
#hud{position:fixed;left:16px;bottom:12px;z-index:8;color:rgba(255,255,255,.62);font:11px system-ui;letter-spacing:.05em;text-shadow:0 2px 10px #000;pointer-events:none}
#error{display:none;position:fixed;left:14px;top:14px;z-index:30;max-width:min(900px,92vw);padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div>
<div id="status">REFERENCE COORDINATES LOADING…</div>
<div id="hud"></div>
<div id="error"></div>

<script src="./ref0.js"></script><script src="./ref1.js"></script><script src="./ref2.js"></script>
<script src="./ref3.js"></script><script src="./ref4.js"></script><script src="./ref5.js"></script>

<script>
const LABELS=["새벽","아침","낮","노을","블루아워","밤"],W=320,H=180,N=W*H;
const CDN=["https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js","https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js","https://unpkg.com/three@0.128.0/build/three.min.js"];

function loadScript(url){return new Promise((ok,bad)=>{const s=document.createElement("script");s.src=url;s.onload=ok;s.onerror=()=>bad(new Error("Three CDN failed"));document.head.appendChild(s)})}
async function ensureThree(){if(window.THREE)return;for(const u of CDN){try{await loadScript(u);if(window.THREE)return}catch(e){}}throw new Error("Three.js load failed")}

function looseBase64Bytes(src){
  let s=String(src||"");
  const comma=s.indexOf(","); if(comma>=0)s=s.slice(comma+1);
  const map=new Int16Array(128);map.fill(-1);
  const abc="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  for(let i=0;i<64;i++)map[abc.charCodeAt(i)]=i;
  map[45]=62;map[95]=63;
  const out=[];let acc=0,bits=0;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i); if(c===61)break; if(c>=128)continue;
    const v=map[c]; if(v<0)continue;
    acc=(acc<<6)|v;bits+=6;
    while(bits>=8){bits-=8;out.push((acc>>bits)&255)}
    if(bits>24)acc&=(1<<bits)-1;
  }
  if(out.length<4)throw new Error("reference base64 payload too short");
  if(out[0]!==255||out[1]!==216)throw new Error("reference JPEG header invalid");
  if(out[out.length-2]!==255||out[out.length-1]!==217)out.push(255,217);
  return new Uint8Array(out);
}
function imageFromBlob(blob){
  if(window.createImageBitmap)return createImageBitmap(blob);
  return new Promise((ok,bad)=>{const u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=()=>{URL.revokeObjectURL(u);bad(new Error("JPEG decode failed"))};im.src=u});
}
async function decodeRef(src,n){
  try{return await imageFromBlob(new Blob([looseBase64Bytes(src)],{type:"image/jpeg"}))}
  catch(e){throw new Error("reference "+(n+1)+" decode failed: "+(e&&e.message?e.message:e))}
}
function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
function fail(err){console.error(err);document.getElementById("status").textContent="RENDER ERROR";const e=document.getElementById("error");e.style.display="block";e.textContent=String(err&&err.stack?err.stack:err)}

async function main(){
  await ensureThree();
  if(!window.TRACE_REFS||TRACE_REFS.filter(Boolean).length!==6)throw new Error("reference files missing");
  const ims=await Promise.all(TRACE_REFS.map((s,i)=>decodeRef(s,i)));

  const sets=[],cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const cx=cv.getContext("2d",{willReadFrequently:true});
  for(const im of ims){
    cx.clearRect(0,0,W,H);cx.drawImage(im,0,0,W,H);
    const raw=cx.getImageData(0,0,W,H).data;
    const f=new Float32Array(N*3);
    for(let i=0,j=0;i<N;i++,j+=3){const k=i*4;f[j]=raw[k]/255;f[j+1]=raw[k+1]/255;f[j+2]=raw[k+2]/255}
    sets.push(f);
  }

  const pos=new Float32Array(N*3),depth=new Float32Array(N);let pi=0,di=0;
  for(let y=0;y<H;y++){const ny=y/(H-1);for(let x=0;x<W;x++){const nx=x/(W-1);pos[pi++]=nx*2-1;pos[pi++]=1-ny*2;pos[pi++]=0;let d=Math.max(0,(ny-.50)/.50);depth[di++]=d*d}}
  const ind=new Uint16Array((W-1)*(H-1)*6);let q=0;
  for(let y=0;y<H-1;y++)for(let x=0;x<W-1;x++){const a=y*W+x,b=a+1,c=a+W,d=c+1;ind[q++]=a;ind[q++]=c;ind[q++]=b;ind[q++]=b;ind[q++]=c;ind[q++]=d}

  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  geo.setAttribute("aDepth",new THREE.BufferAttribute(depth,1));
  geo.setIndex(new THREE.BufferAttribute(ind,1));
  geo.setAttribute("colorA",new THREE.BufferAttribute(sets[0],3));
  geo.setAttribute("colorB",new THREE.BufferAttribute(sets[1],3));

  const mat=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,uniforms:{uMix:{value:0},uParallax:{value:0}},vertexShader:`attribute vec3 colorA;attribute vec3 colorB;attribute float aDepth;varying vec3 vColor;uniform float uMix;uniform float uParallax;void main(){float m=uMix*uMix*(3.0-2.0*uMix);vColor=mix(colorA,colorB,m);vec3 p=position;p.x+=uParallax*aDepth;gl_Position=vec4(p,1.0);}`,fragmentShader:`precision highp float;varying vec3 vColor;void main(){gl_FragColor=vec4(vColor,1.0);}`});

  const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight,false);renderer.setClearColor(0x020611,1);
  document.getElementById("app").appendChild(renderer.domElement);

  const scene=new THREE.Scene(),camera=new THREE.Camera();scene.add(new THREE.Mesh(geo,mat));

  let fixed=-1,A=-1,B=-1,start=performance.now();
  function pair(a,b){if(a===A&&b===B)return;A=a;B=b;geo.setAttribute("colorA",new THREE.BufferAttribute(sets[a],3));geo.setAttribute("colorB",new THREE.BufferAttribute(sets[b],3))}
  addEventListener("keydown",e=>{if(e.key>="1"&&e.key<="6")fixed=+e.key-1;if(e.key.toLowerCase()==="r")fixed=-1});
  addEventListener("resize",()=>{renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight,false)});
  const hud=document.getElementById("hud"),status=document.getElementById("status");
  status.classList.add("hide");setTimeout(()=>status.remove(),500);

  function frame(){
    requestAnimationFrame(frame);
    const sec=(performance.now()-start)/1000,t=sec/14;let a,b,m;
    if(fixed>=0){a=b=fixed;m=0}else{a=Math.floor(t)%6;b=(a+1)%6;const u=t-Math.floor(t);m=u<.68?0:smooth((u-.68)/.32)}
    pair(a,b);mat.uniforms.uMix.value=m;mat.uniforms.uParallax.value=Math.sin(sec*.14)*.0012;
    hud.textContent=(fixed>=0?"고정 ":"자동 ")+String(a+1).padStart(2,"0")+" "+LABELS[a]+" · "+N.toLocaleString()+" reference coordinates · Three.js · 1~6 / R";
    renderer.render(scene,camera);
  }
  frame();
}
main().catch(fail);
</script>
</body></html>
