<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky Coordinate Trace v10.5 Blob Decode Fixed</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{position:fixed;inset:0;background:#020611}
canvas{display:block;width:100%;height:100%}
#status{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#020611;color:#dce9ff;font:12px system-ui;letter-spacing:.12em;transition:opacity .45s ease}
#status.hide{opacity:0;pointer-events:none}
#hud{position:fixed;left:18px;bottom:14px;z-index:10;color:rgba(255,255,255,.65);font:11px system-ui;letter-spacing:.06em;text-shadow:0 2px 10px #000;pointer-events:none}
#error{display:none;position:fixed;left:16px;top:16px;z-index:30;max-width:min(760px,90vw);padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.72);color:#fff;font:12px/1.45 monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div>
<div id="status">TRACING REFERENCE COORDINATES…</div>
<div id="hud"></div>
<div id="error"></div>

<script src="./ref0.js"></script>
<script src="./ref1.js"></script>
<script src="./ref2.js"></script>
<script src="./ref3.js"></script>
<script src="./ref4.js"></script>
<script src="./ref5.js"></script>

<script>
const LABELS=["새벽","아침","낮","노을","블루아워","밤"];
const CDN=[
 "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",
 "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
 "https://unpkg.com/three@0.128.0/build/three.min.js"
];

function loadScript(url){
 return new Promise((ok,bad)=>{
   const s=document.createElement("script");
   s.src=url;s.onload=ok;s.onerror=bad;document.head.appendChild(s);
 });
}
async function ensureThree(){
 if(window.THREE)return;
 for(const u of CDN){try{await loadScript(u);if(window.THREE)return}catch(e){}}
 throw new Error("Three.js load failed");
}
function b64bytes(str){
 const comma=str.indexOf(',');
 const b64=comma>=0?str.slice(comma+1):str;
 const bin=atob(b64),out=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
 return out;
}
async function decodeEmbeddedJPEG(src){
 const blob=new Blob([b64bytes(src)],{type:'image/jpeg'});
 if(!window.createImageBitmap) throw new Error('createImageBitmap unsupported');
 try{return await createImageBitmap(blob)}catch(e){throw new Error('embedded JPEG decode failed: '+(e&&e.message?e.message:String(e)))}
}
function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}

async function main(){
 await ensureThree();
 if(!window.TRACE_REFS||TRACE_REFS.filter(Boolean).length!==6) throw new Error("reference data missing");

 const app=document.getElementById("app");
 const hud=document.getElementById("hud");
 const status=document.getElementById("status");

 const images=await Promise.all(TRACE_REFS.map(decodeEmbeddedJPEG));
 const W=320,H=180,N=W*H;

 const colorSets=[];
 const rawSets=[];
 const cv=document.createElement("canvas");cv.width=W;cv.height=H;
 const cx=cv.getContext("2d",{willReadFrequently:true});
 for(const im of images){
   cx.clearRect(0,0,W,H);
   cx.drawImage(im,0,0,W,H);
   const raw=cx.getImageData(0,0,W,H).data;
   rawSets.push(new Uint8ClampedArray(raw));
   const colors=new Float32Array(N*3);
   for(let i=0,j=0;i<N;i++,j+=3){
     const k=i*4;
     colors[j]=raw[k]/255;
     colors[j+1]=raw[k+1]/255;
     colors[j+2]=raw[k+2]/255;
   }
   colorSets.push(colors);
   if(im.close) im.close();
 }

 const pos=new Float32Array(N*3);
 const dep=new Float32Array(N);
 let pi=0,di=0;
 for(let y=0;y<H;y++){
   const ny=y/(H-1);
   for(let x=0;x<W;x++){
     const nx=x/(W-1);
     pos[pi++]=nx*2-1;
     pos[pi++]=1-ny*2;
     pos[pi++]=0;
     let d=Math.max(0,(ny-.52)/.48);
     dep[di++]=d*d;
   }
 }
 const idx=new Uint16Array((W-1)*(H-1)*6);
 let ii=0;
 for(let y=0;y<H-1;y++){
   for(let x=0;x<W-1;x++){
     const a=y*W+x,b=a+1,c=a+W,d=c+1;
     idx[ii++]=a;idx[ii++]=c;idx[ii++]=b;
     idx[ii++]=b;idx[ii++]=c;idx[ii++]=d;
   }
 }

 const geo=new THREE.BufferGeometry();
 geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
 geo.setAttribute("aDepth",new THREE.BufferAttribute(dep,1));
 geo.setIndex(new THREE.BufferAttribute(idx,1));
 geo.setAttribute("colorA",new THREE.BufferAttribute(colorSets[0],3));
 geo.setAttribute("colorB",new THREE.BufferAttribute(colorSets[1],3));

 const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
 renderer.setSize(innerWidth,innerHeight,false);
 renderer.setClearColor(0x020611,1);
 app.appendChild(renderer.domElement);

 const scene=new THREE.Scene();
 const camera=new THREE.Camera();

 const mat=new THREE.ShaderMaterial({
   depthTest:false,depthWrite:false,
   uniforms:{uMix:{value:0},uParallax:{value:0},uVignette:{value:.035}},
   vertexShader:`
     attribute vec3 colorA;
     attribute vec3 colorB;
     attribute float aDepth;
     varying vec3 vColor;
     varying vec2 vUv;
     uniform float uMix;
     uniform float uParallax;
     void main(){
       float m=uMix*uMix*(3.0-2.0*uMix);
       vColor=mix(colorA,colorB,m);
       vUv=position.xy*.5+.5;
       vec3 p=position;
       p.x+=uParallax*aDepth;
       gl_Position=vec4(p,1.0);
     }`,
   fragmentShader:`
     precision highp float;
     varying vec3 vColor;
     varying vec2 vUv;
     uniform float uVignette;
     void main(){
       vec2 q=vUv-.5;
       float v=1.0-uVignette*dot(q,q)*2.0;
       gl_FragColor=vec4(vColor*v,1.0);
     }`
 });
 const surface=new THREE.Mesh(geo,mat);
 scene.add(surface);

 const nr=rawSets[5];
 const starCandidates=[];
 for(let y=2;y<Math.floor(H*.69);y+=1){
   for(let x=2;x<W-2;x+=1){
     const k=(y*W+x)*4;
     const lum=.2126*nr[k]+.7152*nr[k+1]+.0722*nr[k+2];
     if(lum<105)continue;
     let n=0;
     const offsets=[[-2,0],[2,0],[0,-2],[0,2]];
     for(const o of offsets){
       const kk=((y+o[1])*W+(x+o[0]))*4;
       n+=.2126*nr[kk]+.7152*nr[kk+1]+.0722*nr[kk+2];
     }
     n/=4;
     const contrast=lum-n;
     if(contrast>12) starCandidates.push([x,y,Math.min(1,contrast/75)]);
   }
 }
 starCandidates.sort((a,b)=>b[2]-a[2]);
 const picked=[];
 const occupied=new Uint8Array(N);
 for(const s of starCandidates){
   const x=s[0],y=s[1];
   let close=false;
   for(let oy=-1;oy<=1&&!close;oy++)for(let ox=-1;ox<=1;ox++){
     const xx=x+ox,yy=y+oy;
     if(xx>=0&&xx<W&&yy>=0&&yy<H&&occupied[yy*W+xx]){close=true;break}
   }
   if(close)continue;
   occupied[y*W+x]=1;picked.push(s);
   if(picked.length>=1300)break;
 }

 const sp=new Float32Array(picked.length*3);
 const power=new Float32Array(picked.length);
 picked.forEach((s,i)=>{
   sp[i*3]=s[0]/(W-1)*2-1;
   sp[i*3+1]=1-s[1]/(H-1)*2;
   sp[i*3+2]=0;
   power[i]=s[2];
 });
 const sg=new THREE.BufferGeometry();
 sg.setAttribute("position",new THREE.BufferAttribute(sp,3));
 sg.setAttribute("aPower",new THREE.BufferAttribute(power,1));
 const sm=new THREE.ShaderMaterial({
   transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending,
   uniforms:{uOpacity:{value:0},uTime:{value:0},uPR:{value:Math.min(devicePixelRatio,1.6)}},
   vertexShader:`
    attribute float aPower;
    varying float vPower;
    uniform float uTime;
    uniform float uPR;
    void main(){
      vPower=aPower;
      float tw=.72+.28*sin(uTime*(1.2+aPower*2.3)+position.x*61.0+position.y*43.0);
      gl_PointSize=(.9+2.7*aPower)*uPR*tw;
      gl_Position=vec4(position,1.0);
    }`,
   fragmentShader:`
    precision highp float;
    varying float vPower;
    uniform float uOpacity;
    void main(){
      vec2 p=gl_PointCoord-.5;
      float a=smoothstep(.5,0.0,length(p));
      a*=a*uOpacity*(.35+.65*vPower);
      gl_FragColor=vec4(vec3(.75,.86,1.0)*(1.0+.5*vPower),a);
    }`
 });
 const starPts=new THREE.Points(sg,sm);
 scene.add(starPts);

 function fogTex(){
   const c=document.createElement("canvas");c.width=512;c.height=96;
   const g=c.getContext("2d");
   for(let i=0;i<18;i++){
     const x=Math.random()*512,y=25+Math.random()*45,r=35+Math.random()*85;
     const q=g.createRadialGradient(x,y,0,x,y,r);
     q.addColorStop(0,"rgba(225,235,255,.16)");
     q.addColorStop(1,"rgba(225,235,255,0)");
     g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
   }
   const t=new THREE.CanvasTexture(c);t.minFilter=t.magFilter=THREE.LinearFilter;return t;
 }
 const fg=new THREE.Group();scene.add(fg);
 const ft=fogTex();
 for(let i=0;i<4;i++){
   const s=new THREE.Sprite(new THREE.SpriteMaterial({map:ft,transparent:true,opacity:.018,depthTest:false,depthWrite:false}));
   s.position.set(-.8+i*.5,-.53-i*.012,0);s.scale.set(1.15,.16,1);fg.add(s);
 }

 let fixed=-1,current=-1,next=-1;
 const started=performance.now();
 const DUR=14;

 function setPair(a,b){
   if(a===current&&b===next)return;
   current=a;next=b;
   geo.setAttribute("colorA",new THREE.BufferAttribute(colorSets[a],3));
   geo.setAttribute("colorB",new THREE.BufferAttribute(colorSets[b],3));
 }

 function nightMix(a,b,m){
   const A=a===5?1:(a===4?.14:0);
   const B=b===5?1:(b===4?.14:0);
   m=smooth(m);return A*(1-m)+B*m;
 }

 function tick(){
   requestAnimationFrame(tick);
   const sec=(performance.now()-started)/1000;
   let a,b,m;
   if(fixed>=0){a=b=fixed;m=0}
   else{
     const t=sec/DUR;
     a=Math.floor(t)%6;b=(a+1)%6;
     const local=t-Math.floor(t);
     m=local<.68?0:smooth((local-.68)/.32);
   }
   setPair(a,b);
   mat.uniforms.uMix.value=m;
   mat.uniforms.uParallax.value=Math.sin(sec*.13)*.00165;

   sm.uniforms.uOpacity.value=nightMix(a,b,m)*.72;
   sm.uniforms.uTime.value=sec;

   fg.children.forEach((s,i)=>{
     s.position.x+=.000035*(i+1);
     if(s.position.x>1.35)s.position.x=-1.35;
   });

   hud.textContent=(fixed>=0?"고정 ":"자동 ")+String(a+1).padStart(2,"0")+" "+LABELS[a]+" · "+N.toLocaleString()+" reference-traced vertices · 1~6 / R";
   renderer.render(scene,camera);
 }

 addEventListener("keydown",e=>{
   if(e.key>="1"&&e.key<="6")fixed=Number(e.key)-1;
   if(e.key.toLowerCase()==="r")fixed=-1;
 });
 addEventListener("resize",()=>{
   renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
   renderer.setSize(innerWidth,innerHeight,false);
   sm.uniforms.uPR.value=Math.min(devicePixelRatio,1.6);
 });

 status.classList.add("hide");
 setTimeout(()=>status.remove(),700);
 tick();
}
main().catch(err=>{
 console.error(err);
 document.getElementById("status").textContent="RENDER ERROR";
 const el=document.getElementById("error");el.style.display="block";el.textContent=(err instanceof Error?(err.name+": "+err.message+"\n"+(err.stack||"")):String(err));
});
</script>
</body>
</html>
