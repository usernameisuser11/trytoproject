<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Sky Timelapse v2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071021}
canvas{display:block;width:100%;height:100%}
#status{position:fixed;inset:0;display:grid;place-items:center;background:#071021;color:#d9e7ff;font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.12em;z-index:9;transition:opacity .45s ease}
#phase{position:fixed;left:18px;bottom:16px;color:rgba(255,255,255,.66);font:12px/1.2 system-ui,sans-serif;letter-spacing:.12em;text-shadow:0 2px 8px #000;pointer-events:none}
</style>
</head>
<body>
<div id="status">LOADING SKY…</div>
<div id="phase"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

const statusEl=document.getElementById('status');
const phaseEl=document.getElementById('phase');

try{
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.1,500);
  camera.position.set(0,8,42);
  camera.lookAt(0,8,0);

  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.02;
  document.body.appendChild(renderer.domElement);

  const DURATION=110;
  const start=performance.now();
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const smooth=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
  const mixColor=(a,b,t)=>new THREE.Color(a).lerp(new THREE.Color(b),t);

  function phase(){return (((performance.now()-start)/1000)%DURATION)/DURATION}
  function label(t){if(t<.12)return'새벽';if(t<.29)return'아침';if(t<.52)return'낮';if(t<.70)return'노을';if(t<.82)return'블루아워';return'밤'}

  // ---------- SKY CANVAS TEXTURE: no shader dependency ----------
  const skyCanvas=document.createElement('canvas');
  skyCanvas.width=32;skyCanvas.height=512;
  const skyCtx=skyCanvas.getContext('2d');
  const skyTex=new THREE.CanvasTexture(skyCanvas);
  skyTex.colorSpace=THREE.SRGBColorSpace;
  skyTex.minFilter=THREE.LinearFilter;
  skyTex.magFilter=THREE.LinearFilter;
  const skyMat=new THREE.MeshBasicMaterial({map:skyTex,depthWrite:false,depthTest:false});
  const sky=new THREE.Mesh(new THREE.PlaneGeometry(260,150),skyMat);
  sky.position.set(0,19,-105);
  sky.renderOrder=-100;
  scene.add(sky);

  function skyStops(t){
    let top,horizon,mid;
    if(t<.12){const k=t/.12;top=mixColor(0x07132e,0x4a80bd,k);mid=mixColor(0x333f76,0x93bbdf,k);horizon=mixColor(0xd0738f,0xffcf9b,k)}
    else if(t<.29){const k=(t-.12)/.17;top=mixColor(0x4a80bd,0x3190d8,k);mid=mixColor(0x93bbdf,0x9dd6f0,k);horizon=mixColor(0xffcf9b,0xd7eef8,k)}
    else if(t<.52){const k=(t-.29)/.23;top=mixColor(0x3190d8,0x1975c1,k);mid=mixColor(0x9dd6f0,0x7dc4eb,k);horizon=mixColor(0xd7eef8,0xc2e8f7,k)}
    else if(t<.70){const k=(t-.52)/.18;top=mixColor(0x1975c1,0x4d397e,k);mid=mixColor(0x7dc4eb,0xc55e8c,k);horizon=mixColor(0xc2e8f7,0xff754d,k)}
    else if(t<.82){const k=(t-.70)/.12;top=mixColor(0x4d397e,0x10234e,k);mid=mixColor(0xc55e8c,0x344b7f,k);horizon=mixColor(0xff754d,0x5d4d80,k)}
    else if(t<.97){const k=(t-.82)/.15;top=mixColor(0x10234e,0x030817,k);mid=mixColor(0x344b7f,0x0b1e3c,k);horizon=mixColor(0x5d4d80,0x18304d,k)}
    else{const k=(t-.97)/.03;top=mixColor(0x030817,0x07132e,k);mid=mixColor(0x0b1e3c,0x333f76,k);horizon=mixColor(0x18304d,0xd0738f,k)}
    return {top,mid,horizon};
  }

  let lastSky=-1;
  function drawSky(t){
    if(Math.abs(t-lastSky)<.002 && t>lastSky)return;
    lastSky=t;
    const s=skyStops(t);
    const g=skyCtx.createLinearGradient(0,0,0,512);
    g.addColorStop(0,'#'+s.top.getHexString());
    g.addColorStop(.62,'#'+s.mid.getHexString());
    g.addColorStop(1,'#'+s.horizon.getHexString());
    skyCtx.fillStyle=g;skyCtx.fillRect(0,0,32,512);
    if(t>.50&&t<.73){
      const k=1-Math.abs((t-.615)/.115);
      const gg=skyCtx.createLinearGradient(0,260,0,512);
      gg.addColorStop(0,'rgba(255,98,116,0)');
      gg.addColorStop(1,`rgba(255,135,70,${.22*clamp(k)})`);
      skyCtx.fillStyle=gg;skyCtx.fillRect(0,250,32,262);
    }
    skyTex.needsUpdate=true;
  }

  // ---------- CIRCULAR POINT TEXTURE ----------
  function pointTexture(){
    const c=document.createElement('canvas');c.width=c.height=64;
    const x=c.getContext('2d');
    const g=x.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.18,'rgba(255,255,255,.95)');g.addColorStop(.5,'rgba(255,255,255,.28)');g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);
  }
  const dotTex=pointTexture();

  function makePoints(count,gen,size,opacity=1){
    const p=new Float32Array(count*3),c=new Float32Array(count*3);
    for(let i=0;i<count;i++){
      const v=gen(i);p[i*3]=v.x;p[i*3+1]=v.y;p[i*3+2]=v.z;
      const col=new THREE.Color(v.color||0xffffff);c[i*3]=col.r;c[i*3+1]=col.g;c[i*3+2]=col.b;
    }
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(p,3));geo.setAttribute('color',new THREE.BufferAttribute(c,3));
    const mat=new THREE.PointsMaterial({size,map:dotTex,transparent:true,opacity,depthWrite:false,vertexColors:true,blending:THREE.AdditiveBlending,sizeAttenuation:true});
    const pts=new THREE.Points(geo,mat);scene.add(pts);return pts;
  }

  const stars=makePoints(7000,()=>({x:THREE.MathUtils.randFloat(-95,95),y:THREE.MathUtils.randFloat(4,61),z:THREE.MathUtils.randFloat(-82,-67),color:Math.random()<.12?0xd8e6ff:0xffffff}),.19,0);
  const brightStars=makePoints(320,()=>({x:THREE.MathUtils.randFloat(-90,90),y:THREE.MathUtils.randFloat(7,58),z:THREE.MathUtils.randFloat(-75,-64),color:Math.random()<.3?0xbed9ff:0xffffff}),.34,0);

  function galaxyPoint(spread,pinkChance=.1){
    const x=THREE.MathUtils.randFloat(-105,105);
    const axis=30 + x*.08 + Math.sin(x*.022)*4;
    const y=axis + THREE.MathUtils.randFloatSpread(spread);
    const r=Math.random();
    const color=r<pinkChance?0xffa9da:(r<.58?0xa9c3ff:0xf2f4ff);
    return {x,y,z:THREE.MathUtils.randFloat(-79,-69),color};
  }
  const galaxyHaze=makePoints(12000,()=>galaxyPoint(17,.06),.23,0);
  const galaxyCore=makePoints(9000,()=>galaxyPoint(6,.16),.30,0);

  function galaxyGlowTexture(){
    const c=document.createElement('canvas');c.width=1024;c.height=180;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,180);g.addColorStop(0,'rgba(70,110,255,0)');g.addColorStop(.28,'rgba(85,120,255,.06)');g.addColorStop(.5,'rgba(210,205,255,.24)');g.addColorStop(.60,'rgba(255,175,225,.12)');g.addColorStop(.78,'rgba(100,125,255,.06)');g.addColorStop(1,'rgba(60,90,255,0)');x.fillStyle=g;x.fillRect(0,0,1024,180);
    for(let i=0;i<100;i++){const px=Math.random()*1024,py=55+Math.random()*75,r=10+Math.random()*55;const q=x.createRadialGradient(px,py,0,px,py,r);q.addColorStop(0,Math.random()<.35?'rgba(255,140,210,.10)':'rgba(150,175,255,.10)');q.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=q;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}
    return new THREE.CanvasTexture(c);
  }
  const galaxyGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:galaxyGlowTexture(),transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));
  galaxyGlow.position.set(0,31,-82);galaxyGlow.scale.set(205,30,1);galaxyGlow.material.rotation=THREE.MathUtils.degToRad(-7);scene.add(galaxyGlow);

  // ---------- SUN ----------
  function sunTexture(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const g=x.createRadialGradient(128,128,2,128,128,128);g.addColorStop(0,'rgba(255,250,214,1)');g.addColorStop(.08,'rgba(255,239,185,.95)');g.addColorStop(.25,'rgba(255,194,115,.30)');g.addColorStop(1,'rgba(255,155,75,0)');x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)}
  const sun=new THREE.Sprite(new THREE.SpriteMaterial({map:sunTexture(),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));sun.scale.set(11,11,1);sun.position.z=-62;scene.add(sun);

  // ---------- LAYERED LOW MOUNTAINS ----------
  function mountainShape(base,height,seed,segments=60){
    const s=new THREE.Shape();s.moveTo(-120,-30);s.lineTo(-120,base);let prev=base;
    for(let i=0;i<=segments;i++){const x=-120+240*i/segments;const n=Math.sin(i*.31+seed)*.42+Math.sin(i*.13+seed*1.7)*.36+Math.sin(i*.71+seed*.3)*.22;let y=base+height*(.44+n*.19);y=prev*.30+y*.70;prev=y;s.lineTo(x,y)}
    s.lineTo(120,-30);s.closePath();return s;
  }
  const mountainData=[[-8.5,8,2,-48],[-7.5,9,4.3,-42],[-6.8,9,6.5,-36],[-6.0,10,9.1,-30],[-5.2,10.5,13,-24],[-4.5,11,18,-18]];
  const mountains=[];
  mountainData.forEach((d,i)=>{const m=new THREE.Mesh(new THREE.ShapeGeometry(mountainShape(d[0],d[1],d[2])),new THREE.MeshBasicMaterial({color:0x587a93}));m.position.z=d[3];scene.add(m);mountains.push(m)});

  // ---------- FOREST SILHOUETTE ----------
  function forestShape(){
    const s=new THREE.Shape();s.moveTo(-120,-30);s.lineTo(-120,-5);
    const N=220;
    for(let i=0;i<=N;i++){
      const x=-120+240*i/N;let y=-4.8+Math.sin(i*.16)*.38;
      if(i%4===0)y+=2.5+2.8*(.5+.5*Math.sin(i*2.17));
      else if(i%7===0)y+=1.4;
      s.lineTo(x,y)
    }
    s.lineTo(120,-30);s.closePath();return s;
  }
  const forest=new THREE.Mesh(new THREE.ShapeGeometry(forestShape()),new THREE.MeshBasicMaterial({color:0x082016}));forest.position.z=-10;scene.add(forest);

  // ---------- MIST + CLOUDS ----------
  function softTexture(w=768,h=180,a=.16){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');for(let i=0;i<28;i++){const px=Math.random()*w,py=h*.25+Math.random()*h*.55,r=30+Math.random()*100;const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(235,245,255,${a})`);g.addColorStop(1,'rgba(235,245,255,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}return new THREE.CanvasTexture(c)}
  const mistTex=softTexture(1024,150,.14),cloudTex=softTexture(720,220,.20);
  const mists=[];for(let i=0;i<4;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:mistTex,transparent:true,opacity:.11,depthWrite:false}));s.position.set(THREE.MathUtils.randFloat(-55,55),THREE.MathUtils.randFloat(-.5,4),-14-i*5);s.scale.set(90,10,1);scene.add(s);mists.push(s)}
  const clouds=[];for(let i=0;i<6;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,transparent:true,opacity:.12,depthWrite:false}));s.position.set(THREE.MathUtils.randFloat(-85,85),THREE.MathUtils.randFloat(22,48),-58-i*.5);const sc=THREE.MathUtils.randFloat(24,42);s.scale.set(sc,sc*.28,1);scene.add(s);clouds.push(s)}

  // ---------- SHOOTING STAR ----------
  const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(-7,-2.4,0)]);
  const lineMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending});
  const shooting=new THREE.Line(lineGeo,lineMat);shooting.position.z=-56;scene.add(shooting);let nextShot=0;

  const cDayFar=new THREE.Color(0x7192a8),cDayNear=new THREE.Color(0x214e50),cSunFar=new THREE.Color(0xa97990),cSunNear=new THREE.Color(0x302c43),cNightFar=new THREE.Color(0x345178),cNightNear=new THREE.Color(0x071425);

  function updateMountains(t){
    mountains.forEach((m,i)=>{const d=i/(mountains.length-1);let c;if(t<.54)c=cDayFar.clone().lerp(cDayNear,d);else if(t<.74)c=cSunFar.clone().lerp(cSunNear,d);else c=cNightFar.clone().lerp(cNightNear,d);m.material.color.copy(c)});
    forest.material.color.copy(new THREE.Color(0x0c2b1d).lerp(new THREE.Color(0x02070b),smooth(.58,.84,t)));
  }

  statusEl.style.opacity='0';setTimeout(()=>statusEl.remove(),500);

  function frame(){
    requestAnimationFrame(frame);
    const now=performance.now()/1000,t=phase();
    phaseEl.textContent=label(t);
    drawSky(t);

    const sunT=smooth(.07,.68,t);
    sun.position.x=THREE.MathUtils.lerp(-70,70,sunT);
    sun.position.y=4+Math.sin(sunT*Math.PI)*34;
    sun.material.opacity=(1-smooth(.64,.71,t))*0.95;

    let starA=smooth(.73,.84,t);if(t>.97)starA*=1-smooth(.97,1,t);
    stars.material.opacity=starA*.72;
    brightStars.material.opacity=starA*(.72+.18*Math.sin(now*1.7));

    let galA=smooth(.80,.90,t);if(t>.97)galA*=1-smooth(.97,1,t);
    galaxyHaze.material.opacity=galA*.26;
    galaxyCore.material.opacity=galA*.72;
    galaxyGlow.material.opacity=galA*.58;

    clouds.forEach((s,i)=>{s.position.x+=.0045*(1+i*.12);if(s.position.x>105)s.position.x=-105;s.material.opacity=t>.80?.07:.12});
    mists.forEach((s,i)=>{s.position.x+=.0035+i*.0007;if(s.position.x>68)s.position.x=-68;s.material.opacity=t>.74?.16:.10});
    updateMountains(t);

    if(t>.87&&now>nextShot){nextShot=now+9+Math.random()*13;shooting.position.set(THREE.MathUtils.randFloat(-45,65),THREE.MathUtils.randFloat(30,54),-56);lineMat.opacity=.9}
    shooting.position.x+=.18;shooting.position.y-=.06;lineMat.opacity*=.958;

    renderer.render(scene,camera);
  }
  frame();

  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(err){
  console.error(err);
  statusEl.textContent='RENDER ERROR · '+(err?.message||err);
  statusEl.style.color='#ffb8b8';
}
</script>
</body>
</html>
